document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;const S_=ui.sheet;
  const F=()=>friend(a.dataset.id);
  switch(act){
  case 'close':return closeSheet();
  case 'add':return openSheet({type:'add'});
  case 'open':return openSheet({type:'person',id:a.dataset.id,focus:a.dataset.focus});
  case 'edit':return openSheet({type:'edit',id:a.dataset.id});
  case 'reflect':return openSheet({type:'reflect',id:a.dataset.id,step:0,ans:{}});
  case 'intro':return openSheet({type:'intro',step:0});
  case 'hint':dismissHint(a.dataset.id);a.closest('.hint').remove();return;
  case 'hintsReset':S.settings.hints=[];saveSettings();toast('Tips will show again');return;
  case 'filter':ui.filter=a.dataset.k;return render();
  case 'pmode':ui.peopleMode=a.dataset.m;return render();
  case 'pickNext':ui.pick++;return render();
  case 'tone':S.settings.tone=a.dataset.v;saveSettings();render();if(S_)renderSheet();return;
  case 'avatars':S.settings.avatars=a.dataset.v;saveSettings();render();return;
  case 'quick':{const f=F();if(!f)return;addContact(f,{who:a.dataset.who});ui.pick=0;render();const r=document.getElementById('row-'+f.id);if(r)r.classList.add('flash');return}
  case 'mode':S_.mode=a.dataset.m;return renderSheet();
  case 'logFull':{const f=F();if(!f)return;const d=($('#logDate')||{}).value||todayISO();const note=(($('#logNote')||{}).value||'').trim();
    addContact(f,{who:a.dataset.who,mode:S_.mode||lastMode(f),date:d,note});S_.logNote='';S_.logDate='';S_.detailsOpen=false;renderSheet();render();const ls=$('#logSec');if(ls)ls.classList.add('flash');return}
  case 'checkin':return openSheet({type:'checkin',id:a.dataset.id,cid:a.dataset.c});
  case 'ci':{const f=friend(S_.id);const c=f&&f.contacts.find(x=>x.id===S_.cid);if(!c)return;const k=a.dataset.k,v=a.dataset.v;
    if(k==='depth'||k==='feel'){c[k]=c[k]===v?'':v}else if(k==='reply'){c.reply=c.reply===v?'':v;if(v==='replied'&&!c.replyDate)c.replyDate=todayISO()}else c[k]=v;
    if(k==='who'){c.reply=c.who==='me'?defaultReply(c):''}if(k==='mode'&&c.who==='me'&&(!c.reply||c.reply==='waiting'))c.reply=defaultReply(c);
    saveFriend(f);renderSheet();render();return}
  case 'ciAsk':{const f=F();const i=$('#ciAsk');const v=i&&i.value.trim();if(!f||!v)return;f.followups=(f.followups||[]).concat([{id:rid(),text:v,done:false,date:todayISO()}]);saveFriend(f);i.value='';toast('Added to Ask about next time');render();return}
  case 'replied':case 'noreply':{const f=F();if(!f)return;const w=waitingOf(f)[0];if(!w)return;const prev={reply:w.reply,replyDate:w.replyDate};
    w.reply=act==='replied'?'replied':'none';w.replyDate=todayISO();saveFriend(f);render();renderSheet();
    toast(act==='replied'?`${esc(f.name)} replied`:`Marked no reply`,()=>{w.reply=prev.reply;w.replyDate=prev.replyDate;saveFriend(f);render();renderSheet()});return}
  case 'meClear':S.settings.me=null;saveSettings();render();return;
  case 'theirStyle':{const f=F();if(!f)return;f.style=a.dataset.v;saveFriend(f);renderSheet();render();return}
  case 'meQuiz':return openSheet({type:'me',ans:Object.assign({},(S.settings.me&&S.settings.me.answers)||{})});
  case 'meAns':S_.ans[a.dataset.q]=Number(a.dataset.v);return renderSheet();
  case 'meSave':if(S_.result){S.settings.me={answers:S_.ans,anx:+S_.result.anx.toFixed(2),avo:+S_.result.avo.toFixed(2),style:S_.result.style,date:todayISO()};saveSettings();toast('Saved: '+esc(STYLES[S_.result.style].name));closeSheet()}return;
  case 'repair':return openSheet({type:'repair',id:a.dataset.id,step:0});
  case 'rp':S_.plan[a.dataset.k]=a.dataset.v;if(a.dataset.k==='type'){S_.plan.path=null}return renderSheet();
  case 'rpWant':{const w=S_.plan.wants;const i=w.indexOf(a.dataset.v);if(i<0)w.push(a.dataset.v);else w.splice(i,1);return renderSheet()}
  case 'rpNext':if(a.disabled)return;if(S_.step===4&&S_.plan.path&&S_.plan.path!==recPath(S_.plan))S_.plan.path=null;S_.step++;renderSheet();$('#sheet').scrollTop=0;return;
  case 'rpBack':S_.step=Math.max(0,S_.step-1);renderSheet();$('#sheet').scrollTop=0;return;
  case 'rpSave':{const f=F();if(!f)return;const pl=Object.assign({},S_.plan,{status:'open'});delete pl.openerFor;f.plans=(f.plans||[]).filter(x=>x.id!==pl.id).concat([pl]);saveFriend(f);ui.sheet={type:'person',id:f.id};renderSheet();$('#sheet').scrollTop=0;render();toast('Gameplan saved. It’s on '+esc(f.name)+'’s page under Working through.');return}
  case 'viewPlan':return openSheet({type:'plan',id:a.dataset.id,pid:a.dataset.p});

    if(pl.outcome==='repaired'&&!f.tempered&&tierIdx(f)>=2){const t=$('#toast');t.innerHTML=`<span>Glad it’s repaired. Working through hard things is what Tempered means. Mark ${esc(f.name)} as Tempered?</span><button class="tb" id="tTemp">Mark Tempered</button>`;t.classList.add('show');$('#tTemp').onclick=()=>{f.tempered=true;saveFriend(f);t.classList.remove('show');renderSheet();render()};clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),8000)}
    else toast('Noted. Thanks for doing the hard thing.');return}
  case 'planReopen':{const f=F();const pl=f&&(f.plans||[]).find(x=>x.id===a.dataset.p);if(!pl)return;pl.status='open';delete pl.outcome;saveFriend(f);renderSheet();render();return}
  case 'planDelete':{const f=F();if(!f)return;const pid=a.dataset.p;if(ui.arm!=='plan'+pid){ui.arm='plan'+pid;renderSheet();return}ui.arm=null;f.plans=(f.plans||[]).filter(x=>x.id!==pid);saveFriend(f);ui.sheet={type:'person',id:f.id};renderSheet();render();return}
  case 'allHist':S_.allHist=true;return renderSheet();
  case 'delContact':{const f=F();if(!f)return;const c=f.contacts.find(x=>x.id===a.dataset.c);f.contacts=f.contacts.filter(x=>x.id!==a.dataset.c);saveFriend(f);if(S_&&S_.type==='checkin')ui.sheet={type:'person',id:f.id};renderSheet();render();toast('Entry deleted',()=>{f.contacts.push(c);saveFriend(f);renderSheet();render()});return}
  case 'delItem':{const f=F();if(!f)return;const k=a.dataset.k;const it=(f[k]||[]).find(x=>x.id===a.dataset.i);f[k]=(f[k]||[]).filter(x=>x.id!==a.dataset.i);saveFriend(f);renderSheet();render();toast('Deleted',()=>{f[k].push(it);saveFriend(f);renderSheet();render()});return}
  case 'best':{const f=F();if(f){setBest(f,a.dataset.v);renderSheet();render()}return}
  case 'snooze':{const f=F();if(!f)return;f.snooze=addDays(todayISO(),Number(a.dataset.n));saveFriend(f);renderSheet();render();toast(`Snoozed until ${fmtDate(f.snooze)}`);return}
  case 'unsnooze':{const f=F();if(!f)return;f.snooze='';saveFriend(f);renderSheet();render();return}
  case 'resetPT':{const f=F();if(!f)return;f.cadence=null;f.timing={};saveFriend(f);renderSheet();render();toast('Using the defaults');return}
  case 'noPhoto':{const f=F();if(!f)return;delete f.photo;saveFriend(f);renderSheet();render();return}
  case 'ics':{const f=F();if(f)icsFor([f]);return}
  case 'icsAll':return icsFor(S.friends);
  case 'delFriend':{const id=a.dataset.id;if(ui.arm!==id){ui.arm=id;renderSheet();return}const f=clone(friend(id));removeFriend(id);closeSheet();toast(`Deleted ${esc(f.name)}`,()=>{saveFriend(f);render()});return}
  case 'rNext':{if(a.disabled)return;const rx=$('#rExp');if(rx){const f=friend(S_.id);f.expect=rx.value;saveFriend(f)}S_.step++;renderSheet();$('#sheet').scrollTop=0;return}
  case 'rBack':S_.step=Math.max(0,S_.step-1);renderSheet();$('#sheet').scrollTop=0;return;
  case 'rFair':S_.fair=a.dataset.v;return renderSheet();
  case 'ans':S_.ans[a.dataset.q]=a.dataset.v;return renderSheet();
  case 'rApply':{const f=F();if(!f)return;f.lastCheck={date:todayISO(),suggested:S_.sug};const k=a.dataset.tier;
    if(k&&k!==f.tier){setTier(f,k);toast(`${esc(f.name)} → ${esc(tierOf(f).name)}`)}else saveFriend(f);
    ui.sheet={type:'person',id:f.id};renderSheet();$('#sheet').scrollTop=0;render();return}
  case 'iNext':S_.step++;return renderSheet();
  case 'iBack':S_.step--;return renderSheet();
  case 'iDone':S.settings.onboarded=true;saveSettings();if(!S.friends.length){openSheet({type:'add'})}else closeSheet();return;
  case 'resetTiming':S.settings.timing=Object.assign({},DEFAULT_TIMING);saveSettings();render();toast('Timing reset');return;
  case 'resetTiers':if(ui.arm!=='reset'){ui.arm='reset';render();return}ui.arm=null;S.settings.tiers=JSON.parse(JSON.stringify(DEFAULT_TIERS));saveSettings();render();toast('Ladder reset');return;
  case 'addField':{const inp=$('#newField');const v=inp&&inp.value.trim();if(!v)return;S.settings.fields.push({id:rid(),name:v});saveSettings();render();toast(`Added “${esc(v)}” to every person`);return}
  case 'delField':{const id=a.dataset.id;if(ui.arm!=='fld'+id){ui.arm='fld'+id;render();return}S.settings.fields=S.settings.fields.filter(x=>x.id!==id);ui.arm=null;saveSettings();render();return}
  case 'fileBackup':try{localStorage.setItem('orbit.lastBackup',todayISO())}catch(e){}download('orbit-backup-'+todayISO()+'.json',JSON.stringify({app:'orbit',v:3,exported:todayISO(),...S},null,1),'application/json').then(ok=>ok&&toast('Backup file saved'));return;
  case 'copyBackup':{const txt=JSON.stringify({app:'orbit',v:3,exported:todayISO(),...S});navigator.clipboard.writeText(txt).then(()=>toast('Backup copied. Paste it somewhere safe.'),()=>{$('#restore').value=txt;$('#restore').select();toast('Couldn’t copy automatically. It’s in the box below; copy it from there.')});return}
  case 'restore':{let p;try{p=JSON.parse($('#restore').value)}catch(err){toast('That doesn’t look like an Orbit backup.');return}
    if(!p||!Array.isArray(p.friends)){toast('That doesn’t look like an Orbit backup.');return}
    if(a.dataset.mode==='replace'){if(ui.arm!=='replace'){ui.arm='replace';render();return}S.friends.forEach(f=>writeDoc('f_'+f.id,null));S.friends=[];ui.arm=null}
    p.friends.forEach(f=>{const ex=friend(f.id);if(ex){const ids=new Set((ex.contacts||[]).map(c=>c.id));(f.contacts||[]).forEach(c=>{if(!ids.has(c.id))ex.contacts.push(c)});saveFriend(ex)}else saveFriend(f)});
    if(p.settings){S.settings=normalizeSettings(p.settings);saveSettings()}
    toast(`Restored ${p.friends.length} people`);render();return}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&ui.sheet){e.preventDefault();return closeSheet()}
  const g=e.target.closest&&e.target.closest('.orbit [role=button]');
  if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();g.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
  if(e.key==='Tab'&&ui.sheet){ /* keep focus inside the open sheet */
    const f=[...$('#sheet').querySelectorAll('button,input,select,textarea,a[href],summary,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null);
    if(!f.length)return;const first=f[0],last=f[f.length-1];
    if(!$('#sheet').contains(document.activeElement)){e.preventDefault();first.focus();return}
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  }
});
$('#sheet').addEventListener('scroll',()=>{const hd=$('#sheet .hd');if(hd)hd.classList.toggle('stuck',$('#sheet').scrollTop>4)});
let rT;window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{if(ui.view==='people')render()},200)});
function route(){const h=location.hash.slice(1);ui.view=TABS.some(t=>t[0]===h)?h:'reach';ui.arm=null;render();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);
route();
initSync();
if(!S.settings.onboarded)setTimeout(()=>{if(!S.settings.onboarded&&!ui.sheet)openSheet({type:'intro',step:0})},IN_CLAUDE?1500:300);
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!IN_CLAUDE)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
</body>
</html>
