<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F1E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Orbit">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root{
  --paper:#F5F1E8;--surface:#FBF8F1;--ink:#222522;--ink2:#5A564E;--stone:#8B877E;--rule:#E2DBCC;
  --teal:#315E60;--on-teal:#fff;--teal-soft:#E1EAE7;--other:#8973A7;--other-ink:#6E5890;--other-soft:#ECE6F3;
  --amber:#A87836;--amber-ink:#7C5518;--amber-soft:#F3E7D1;
  --t-xs:12px;--t-sm:13px;--t-md:15px;--t-lg:17px;--t-xl:21px;--t-2xl:28px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --r-sm:8px;--r-md:12px;--r-lg:20px;--hit:44px;
  --serif:Fraunces,Georgia,serif;--sans:Inter,system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);--dur:.26s;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#161614;--surface:#1F1E1B;--ink:#EEEAE1;--ink2:#B4AEA3;--stone:#7D786F;--rule:#34312B;
  --teal:#8CBFC0;--on-teal:#10201F;--teal-soft:#22383A;--other:#B7A3D6;--other-ink:#C6B5E2;--other-soft:#2E2840;
  --amber:#D9A75C;--amber-ink:#E5B76F;--amber-soft:#3A2E1A;
}}
@media (prefers-reduced-motion:reduce){:root{--dur:0s}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:var(--t-md)/1.5 var(--sans);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.005em}
p{margin:0 0 var(--s2)}
a{color:var(--teal)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
[tabindex="-1"]:focus{outline:none}

/* ---------- frame ---------- */
.wrap{max-width:680px;margin:0 auto;padding:calc(var(--s4) + env(safe-area-inset-top)) calc(var(--s4) + env(safe-area-inset-right)) 120px calc(var(--s4) + env(safe-area-inset-left))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin:var(--s1) 0 var(--s4)}
header.top h1{font-size:var(--t-2xl);display:flex;align-items:center;gap:10px}
.logo{width:26px;height:26px;color:var(--teal)}
.sync{font-size:var(--t-xs);color:var(--ink2);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--stone)}
.sync.cloud i{background:var(--teal)} .sync.local i,.sync.slow i,.sync.error i{background:var(--amber)}
.lede{font-family:var(--serif);font-size:var(--t-lg);color:var(--ink2);margin:0 0 var(--s4);font-weight:500}
.sec{margin-top:var(--s6)}
.sec>h2{font-size:var(--t-xl);display:flex;align-items:baseline;gap:var(--s2);padding-bottom:var(--s2);border-bottom:1.5px solid var(--ink)}
.sec>h2 small{font-family:var(--sans);font-size:var(--t-sm);font-weight:500;color:var(--ink2)}
.sec>.sub{font-size:var(--t-sm);color:var(--ink2);margin:var(--s2) 0 0}
.kicker{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:600}
.muted{color:var(--ink2)} .small{font-size:var(--t-sm)}

/* ---------- ruled rows (journal) ---------- */
.rows{list-style:none;margin:0;padding:0}
.r{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) 0;border-bottom:1px solid var(--rule)}
.r .main{flex:1;min-width:0}
.name{font:600 var(--t-lg)/1.3 var(--sans);background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer;color:var(--ink);min-height:28px}
.name:hover{text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.meta{font-size:var(--t-sm);color:var(--ink2);margin-top:2px}
.ask{font-size:var(--t-sm);margin-top:6px;color:var(--ink)}
.ask b{font-weight:600;color:var(--teal)}
.acts{display:flex;gap:var(--s2);margin-top:var(--s2);flex-wrap:wrap}
.flash{animation:flash .9s var(--ease)}
@keyframes flash{from{background:var(--teal-soft)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}

/* ---------- marks ---------- */
.tags{display:inline-flex;gap:4px;margin-left:6px;vertical-align:2px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;border:1px solid var(--rule);color:var(--ink2);white-space:nowrap;letter-spacing:.01em}
.tag.bf{border-color:var(--teal);color:var(--teal)}
.st{font-size:var(--t-xs);font-weight:600;white-space:nowrap;padding-top:4px;display:flex;align-items:center;gap:6px;color:var(--ink2)}
.st i{width:8px;height:8px;border-radius:50%;background:var(--stone);display:inline-block}
.st.due{color:var(--amber-ink)} .st.due i{background:var(--amber)}
.st.soon i{background:var(--teal)} .st.soon{color:var(--teal)}
.st.ok i{background:transparent;border:1.5px solid var(--teal)}
.st.off i{background:transparent;border:1.5px dashed var(--stone)}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font:600 13px/1 var(--sans);color:#fff;overflow:hidden;margin-top:2px}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:56px;height:56px;font-size:19px}
.who{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
.who.me{background:var(--teal-soft);color:var(--teal)} .who.them{background:var(--other-soft);color:var(--other-ink)} .who.mutual{background:var(--rule);color:var(--ink2)}
.tones{display:grid;grid-template-columns:1fr;gap:var(--s2)}
@media (min-width:560px){.tones{grid-template-columns:1fr 1fr}}
.tone{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:var(--r-md);padding:var(--s3) var(--s4);cursor:pointer;color:var(--ink)}
.tone.on{border:2px solid var(--teal);padding:calc(var(--s3) - 1px) calc(var(--s4) - 1px)}
.tone b{font-size:var(--t-md)}.tone.on b::after{content:" ✓";color:var(--teal)}
.tone .td{font-size:var(--t-sm);color:var(--ink2)}
.tone .tq{font-family:var(--serif);font-style:italic;font-size:var(--t-sm);border-left:2px solid var(--rule);padding-left:var(--s2)}
.tsum{font-family:var(--serif);font-style:italic;font-size:var(--t-lg);margin:6px 0 var(--s2)}
.dims{display:grid;grid-template-columns:auto 1fr;gap:4px var(--s3);margin:0;font-size:var(--t-md)}
.dims dt{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:600;padding-top:3px}
.dims dd{margin:0}
.chips.wrap{flex-wrap:wrap;overflow:visible}
ul.plain{margin:4px 0 var(--s2);padding-left:20px}ul.plain li{margin:3px 0}
ul.plain.watch li::marker{color:var(--amber)}
.pair{background:var(--teal-soft);border-radius:var(--r-md);padding:var(--s3) var(--s4);margin:var(--s3) 0;font-size:var(--t-md)}
.pair p{margin:0 0 4px}.pair ul{margin:4px 0 0;padding-left:20px}
.linkbtn{background:none;border:0;padding:0;color:var(--teal);font-weight:600;text-decoration:underline;cursor:pointer;font-size:inherit}
.seg.agree button{font-size:12px;padding:0 2px}
.fill{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s2)}.fill span{width:64px;flex:none;font-size:var(--t-sm);color:var(--ink2);font-weight:600}
.flowbox{margin-top:var(--s3);overflow-x:auto}
.flow{display:block;max-width:100%;height:auto;margin:0 auto}
.fc-q{fill:var(--surface);stroke:var(--ink);stroke-width:1.2}
.fc-o{fill:var(--teal-soft);stroke:var(--teal);stroke-width:1.2}
.fc-l{stroke:var(--stone);stroke-width:1.4;fill:none;marker-end:url(#ah)}
.fc-t{font:600 12px var(--sans);fill:var(--ink)}
.fc-o-t{font:600 11px var(--sans);fill:var(--teal)}
.fc-yn{font:600 10px var(--sans);fill:var(--ink2)}
.hbtn{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;min-height:var(--hit)}
.mi{width:16px;height:16px;vertical-align:-3px;color:var(--ink2);flex:none}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:var(--r-md);padding:0 var(--s4);min-height:var(--hit);cursor:pointer;font-weight:500;color:var(--ink);text-decoration:none;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--teal);color:var(--on-teal);border-color:var(--teal);font-weight:600}
.btn.them{border-color:var(--other);color:var(--other-ink)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--teal);padding:0 var(--s2)}
.btn.danger{color:var(--amber-ink);border-color:var(--amber)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 var(--s1);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:99px;padding:0 14px;min-height:40px;font-size:var(--t-sm);white-space:nowrap;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;border:1px solid var(--rule);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:transparent;min-height:var(--hit);font-size:var(--t-sm);cursor:pointer;padding:0 6px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--teal);color:var(--on-teal);font-weight:600}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--rule);background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;min-height:var(--hit)}
textarea{min-height:84px;resize:vertical;line-height:1.45}
input::placeholder,textarea::placeholder{color:var(--stone)}
label.f{display:block;font-size:var(--t-sm);font-weight:600;margin:var(--s4) 0 6px}
.note{font-size:var(--t-sm);color:var(--ink2);margin-top:6px}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:var(--rule);position:relative;cursor:pointer;flex:none;transition:background var(--dur)}
.sw:checked{background:var(--teal)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left var(--dur) var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw:checked::after{left:21px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--rule);min-height:var(--hit)}
.tg:last-child{border-bottom:0}
.tg div b{display:block;font-weight:600}
.tg div span{font-size:var(--t-sm);color:var(--ink2)}
.num{width:84px!important;flex:none;text-align:center}
.li{display:flex;align-items:center;gap:var(--s3);min-height:var(--hit);border-bottom:1px solid var(--rule)}
.li span{flex:1;min-width:0}
.li.done span{text-decoration:line-through;color:var(--ink2)}
.ck{width:22px;height:22px;accent-color:var(--teal);flex:none}
.x{border:0;background:none;color:var(--ink2);font-size:18px;cursor:pointer;min-width:var(--hit);min-height:var(--hit)}
.addrow{display:flex;gap:var(--s2);margin-top:var(--s2)}.addrow input{flex:1}
details.fold>summary{cursor:pointer;list-style:none;min-height:var(--hit);display:flex;align-items:center;gap:8px;font-weight:600;color:var(--teal)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform var(--dur)}
details.fold[open]>summary::before{transform:rotate(45deg)}
.hint{position:relative;background:var(--teal-soft);border-radius:var(--r-md);padding:var(--s3) 48px var(--s3) var(--s4);margin:var(--s4) 0;font-size:var(--t-sm)}
.hint>b:first-child{display:block;font-size:var(--t-md);margin-bottom:2px}
.hint .x{position:absolute;top:0;right:0}
.reality{border-left:3px solid var(--amber);padding:2px 0 2px var(--s3);margin:var(--s3) 0}
.reality p{margin:6px 0;font-size:var(--t-md)}
.exp ul{margin:4px 0 var(--s3);padding-left:20px}.exp li{margin:2px 0}
.exp h4{font-size:var(--t-sm);margin:var(--s3) 0 0;font-weight:600}

/* ---------- featured ---------- */
.feature{padding:var(--s4) 0 var(--s4);border-top:1.5px solid var(--ink);border-bottom:1px solid var(--rule);margin-top:var(--s2);display:flex;gap:var(--s4);align-items:flex-start}
.feature .q{font-family:var(--serif);font-size:var(--t-sm);color:var(--ink2);font-style:italic;margin-bottom:4px}
.feature .name{font-family:var(--serif);font-size:var(--t-xl);font-weight:600}

/* ---------- orbit ---------- */
.orbitbox{margin:var(--s2) 0 var(--s4);text-align:center}
.orbit{display:block;margin:0 auto;max-width:100%;height:auto;overflow:visible}
.orbit .ring{fill:none;stroke:var(--rule);stroke-width:1}
.orbit .rl{font:600 9px var(--sans);fill:var(--stone);letter-spacing:.06em;text-transform:uppercase}
.orbit .you{fill:var(--ink)}
.orbit .youl{font:600 10px var(--sans);fill:var(--paper)}
.orbit .od{cursor:pointer}
.orbit .od circle.d{fill:var(--teal);transition:r var(--dur) var(--ease)}
.orbit .od.them circle.d{fill:var(--other)}
.orbit .od.dorm circle.d{fill:var(--paper);stroke:var(--stone);stroke-width:1.5;stroke-dasharray:2 2}
.orbit .od circle.halo{fill:none;stroke:var(--amber);stroke-width:2}
.orbit .od text{font:600 9px var(--sans);fill:#fff;pointer-events:none}
.orbit .od .nm{fill:var(--ink2);font-weight:500;font-size:10px}
.orbit .od:focus{outline:none}.orbit .od:focus circle.d,.orbit .od:hover circle.d{stroke:var(--ink);stroke-width:2}
.olegend{display:flex;justify-content:center;gap:var(--s4);flex-wrap:wrap;font-size:var(--t-xs);color:var(--ink2);margin-top:var(--s2)}
.olegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* ---------- nav ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--rule);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs .in{display:flex;max-width:680px;width:100%}
nav.tabs a{flex:1;text-align:center;padding:8px 2px 9px;min-height:56px;font-size:11px;color:var(--ink2);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500;position:relative}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a.on{color:var(--teal)}
nav.tabs a.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--teal);border-radius:2px}
nav.tabs .badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--amber);color:#fff;font-size:10px;border-radius:99px;padding:0 5px;font-weight:700;line-height:16px}
.fab{position:fixed;right:max(16px,calc(50% - 324px));bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--teal);color:var(--on-teal);border:0;font-size:28px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer;z-index:6}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,20,18,.38);z-index:20;opacity:0;visibility:hidden;transition:opacity var(--dur),visibility var(--dur)}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:94vh;overflow:auto;overscroll-behavior:contain;background:var(--paper);border-radius:var(--r-lg) var(--r-lg) 0 0;z-index:21;padding:0 0 calc(var(--s5) + env(safe-area-inset-bottom));transform:translateY(100%);visibility:hidden;transition:transform var(--dur) var(--ease),visibility var(--dur);box-shadow:0 -8px 30px rgba(0,0,0,.12)}
.open .scrim{opacity:1;visibility:visible}
.open .sheet{transform:none;visibility:visible}
.sheet .in{max-width:680px;margin:0 auto;padding:0 var(--s5)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--rule);margin:8px auto 0}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);position:sticky;top:0;background:var(--paper);padding:var(--s2) 0;z-index:2;border-bottom:1px solid transparent}
.sheet .hd.stuck{border-bottom-color:var(--rule)}
.sheet .hd h3{font-size:var(--t-xl)}
.sheet .back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--teal);font-weight:600;min-height:var(--hit);cursor:pointer;padding:0}
.ps{padding:var(--s5) 0 var(--s2);border-bottom:1px solid var(--rule)}
.ps:last-of-type{border-bottom:0}
.ps>h4{font-family:var(--serif);font-size:var(--t-lg);margin:0 0 var(--s2);font-weight:600}
.ident{display:flex;gap:var(--s4);align-items:center;padding-top:var(--s2)}
.ident h3{font-size:var(--t-2xl)}
.tierbtn{border:0;background:none;padding:0;color:var(--teal);font-weight:600;cursor:pointer;min-height:32px;font-size:var(--t-md)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px var(--s4);margin:var(--s3) 0 0;font-size:var(--t-md)}
.facts dt{color:var(--ink2);font-size:var(--t-sm);padding-top:2px}
.facts dd{margin:0}
.methods{display:flex;gap:6px;flex-wrap:wrap;margin:var(--s2) 0}
.logbtns{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.steps{display:flex;gap:6px;margin:var(--s2) 0 var(--s4)}
.steps i{flex:1;height:3px;border-radius:3px;background:var(--rule)}
.steps i.on{background:var(--teal)}
.q{padding:var(--s3) 0;border-bottom:1px solid var(--rule)}.q p{margin:0 0 var(--s2);font-weight:500}
.tierpick{display:flex;flex-direction:column}
.tierpick label{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) 0;border-bottom:1px solid var(--rule);cursor:pointer}
.tierpick input{margin-top:4px;accent-color:var(--teal);width:20px;height:20px;flex:none}
.tierpick b{display:block}.tierpick span{font-size:var(--t-sm);color:var(--ink2)}
.intro{text-align:left;padding-top:var(--s4)}
.intro h3{font-size:var(--t-2xl);margin-bottom:var(--s3)}
.intro p{font-size:var(--t-lg);line-height:1.5}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;visibility:hidden;background:var(--ink);color:var(--paper);padding:10px 8px 10px 16px;border-radius:var(--r-md);display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;z-index:30;width:min(520px,94vw);font-size:var(--t-sm);transition:transform var(--dur) var(--ease),opacity var(--dur),visibility var(--dur)}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.toast .tb{background:none;border:1px solid rgba(255,255,255,.25);color:var(--paper);border-radius:99px;min-height:34px;padding:0 10px;cursor:pointer;font-size:12px}
@media (prefers-color-scheme:dark){.toast .tb{border-color:rgba(0,0,0,.25)}}
.toast .tb.on{background:var(--paper);color:var(--ink)}
.toast .undo{font-weight:700;text-decoration:underline;border:0}
.toast>span{flex:1;min-width:0}
.toast .ms{display:flex;gap:4px;width:100%;overflow-x:auto;scrollbar-width:none}.toast .ms::-webkit-scrollbar{display:none}

/* ---------- guide ---------- */
.rung{padding:var(--s4) 0;border-bottom:1px solid var(--rule)}
.rung h3{font-size:var(--t-lg);display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap}

<body>
<div id="app">
  <div class="wrap">
    <header class="top">
      <h1><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="3.5" fill="currentColor"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".7"/><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".35"/><circle cx="24.5" cy="16" r="2.2" fill="currentColor"/></svg>Orbit</h1>

    </header>

  </div>

</div>

<script>
/* =========================================================
   Orbit v3 — a quiet field journal for friendships
   ========================================================= */

/* ---------- model defaults ---------- */
/* Each tier is defined on the same four things: Contact, Knowing, Asking, Effort.
   Each step up adds one thing: chosen → planned → relied on → family. */
const DEFAULT_TIERS=[
 {key:'acq',name:'Acquaintance',cadence:0,summary:'You share a place.',
  contact:'By circumstance only.',knowing:'Names and surface facts.',asking:'Small favors in that setting.',effort:'Nobody plans anything.',
  test:"If the shared place ended, you'd lose touch without noticing.",
  ex:"Classmates, a coworker in another department, the person you keep running into, a regular at your coffee shop."},
 {key:'casual',name:'Casual friend',cadence:45,summary:'You choose each other inside the shared place.',
  contact:'Mostly within the setting, but by choice.',knowing:'A few things that really matter to them.',asking:'Help within the setting (class notes, covering a shift).',effort:'Easy together, rarely planned outside.',
  test:"You'd miss them if the place ended, but staying in touch would take effort.",
  ex:"Your lab partner you actually like, the coworker you get lunch with, someone from small group."},
 {key:'friend',name:'Friend',cadence:21,summary:'You make plans on purpose.',
  contact:'Planned, outside any shared setting.',knowing:'The outline of their story and what they value.',asking:'Ordinary help (a ride, help moving, honest advice).',effort:'Both of you start things sometimes.',
  test:"You've hung out just the two of you, and they've started some of it.",ex:""},
 {key:'good',name:'Good friend',cadence:10,summary:'You rely on each other.',
  contact:"Regular, and they're who you text when you want company.",knowing:"How they work, including when they're off and what helps.",asking:'Real support in a hard week.',effort:'Steady and mutual.',
  test:"You'd notice something was wrong before they told you, and they'd notice with you.",ex:""},
 {key:'homie',name:'Homie',cadence:7,summary:"They're part of your everyday life, like family.",
  contact:'Woven into normal life; no occasion needed.',knowing:'Their people, history and patterns.',asking:'Almost anything, even at 2am.',effort:'You show up for each other without being asked.',
  test:"In an emergency you'd call them, and they'd come.",ex:""}
];
DEFAULT_TIERS.forEach(t=>{t.desc=t.summary+' '+['Contact: '+t.contact,'Knowing: '+t.knowing,'Asking: '+t.asking,'Effort: '+t.effort].join(' ')});
const DIMS=[['contact','Contact','why and how you see each other'],['knowing','Knowing','how well you know each other'],['asking','Asking','what you could fairly ask of them'],['effort','Effort','who starts things']];
const EXPECT={
 acq:["A friendly hello","Small favors in the shared setting"],
 casual:["Warm conversation when you're together","Help within the setting (notes, covering a shift)"],
 friend:["Both of you starting things sometimes","Ordinary help: a ride, help moving","Honest advice","Replying within a few days"],
 good:["Real support in a hard week","Noticing when you're off","Reaching out on their own","Hearing your bad news early"],
 homie:["Showing up without being asked","Help with almost anything, even at 2am","Knowing your people and patterns","Working through conflict instead of disappearing"]
};
const NOTYET={
 acq:["Texting back","Invitations","Remembering details about you","Support in hard times"],
 casual:["Them starting plans outside the setting","Checking in on you","Knowing your big stuff"],
 friend:["Dropping everything for you","Knowing what you need without being told","Being your main support"],
 good:["Being available all the time","Never forgetting things","Being only your friend"],
 homie:["Reading your mind every time","Being your only support","Never having other priorities"]
};
/* Text from earlier versions: if a saved tier still has it unchanged, it gets the new wording. */
const OLD_TEXT={desc:[
 "You know their name and a little about them, and they know a little about you. You see each other because of circumstance, not plans.",
 "You enjoy each other and talk past small talk, but mostly inside a shared setting like class, work, church or a team. Plans just the two of you are rare or new.",
 "You make plans on purpose and see them fairly often. You know the outline of their story and some of what they value, and you're learning how they do relationships.",
 "One of your go-to people. You seek them out when you want company, know each other well, can tell when they're off and know what helps.",
 "Family-level access. You walk right into their house, know their people, and they show up for you, often before you ask. Often the best friend of a particular group or season."],
 test:["You'd say hi, but you wouldn't text them.","You'd sit with them by choice, but you haven't hung out outside the shared place yet.","You could call them on the phone and it wouldn't be weird.","You'd notice something was wrong before they told you.","You'd win a trivia game about them, and you'd call them at 2am."],
 expect:["A friendly hello\nBasic courtesy\nEventually remembering your name","Warm conversation when you're in the same place\nSaying yes sometimes to something tied to that shared setting","Replying within a few days\nSaying yes to plans sometimes\nStarting plans or texts some of the time\nRemembering the big things you've told them","Reaching out on their own\nNoticing when you're off\nShowing up for big moments when they can\nBeing honest with you, kindly","Showing up when things are hard\nAn open door\nKnowing how you work\nWorking through conflict instead of disappearing"],
 notyet:["Texting back\nInvitations\nRemembering details about you\nSupport in hard times","Them starting plans\nChecking in on you\nKnowing your big stuff\nChoosing you over their other plans"]};
DEFAULT_TIERS.forEach(t=>{t.expect=EXPECT[t.key].join('\n');t.notyet=NOTYET[t.key].join('\n')});
const MARKERS=[
 {key:'tempered',name:'Tempered',short:"Tested by time and hard seasons",desc:"The friendship has been through hard seasons (distance, conflict, big life changes) and you both kept choosing it. Like tempered glass or steel, it's stronger for the heating and cooling."},
 {key:'soulmate',name:'Platonic soulmate',short:"It clicked right away",desc:"It clicked right away and it feels like you've known each other for years. This is about fit, not history: someone you met last month can be a soulmate while still being a Friend on the ladder. Soulmate + Tempered is an earned platonic soulmate."},
 {key:'dormant',name:'Dormant',short:"Close once, quiet for now; pauses reminders",desc:"Someone you were close to but aren't in regular touch with right now (moved away, a busy season). Their tier stays as the closeness you had; reminders pause."}
];
const MODES=['Text','Call','In person','Video','Social media','Letter / card','Other'];
const QUICK_MODES=['Text','Call','In person','Video','Other'];
const WHO={me:'You',them:'Them',mutual:'Mutual'};
const DEPTH=[['quick','Quick hello'],['real','Real talk'],['deep','Deep']];
const FEEL=[['good','Felt good'],['okay','Okay'],['hard','Felt off']];
const REPLY=[['waiting','Waiting'],['replied','They replied'],['none','No reply']];
const LIVE=['In person','Video','Call'];
const TONES={gentle:'Gentle',plain:'Straightforward'};
const DEFAULT_TIMING={replyDays:4,soonDays:3,bdayDays:30,balanceDays:365,balanceMin:5,balancePct:80,quietDays:90,gapMult:3,newDays:90,moveDays:30,statsDays:30};
const TIMING_META=[
 ['replyDays','“Waiting on a reply” after','days with no answer',0],
 ['soonDays','“Coming up” heads-up','days before someone is due',1],
 ['bdayDays','Birthday heads-up','days before a birthday',1],
 ['statsDays','Summary line on Reach out','days counted',0],
 ['balanceDays','“Worth a look” looks back','days',0],
 ['balanceMin','“Worth a look” needs at least','contacts',0],
 ['balancePct','“Worth a look” when one side starts','% or more',0],
 ['quietDays','“They haven’t reached out” note','days with nothing from them',1],
 ['gapMult','“Long gap” note','× their reminder days',0],
 ['newDays','“Still new” note','days since you met',0],
 ['moveDays','“Moved up recently” note','days since the move',0]
];
const QUIZ=[
 {lvl:1,q:"When you're together, you talk past small talk."},
 {lvl:2,q:"You make plans on purpose, not just run into each other."},
 {lvl:2,q:"Both of you start plans or conversations, not only you."},
 {lvl:3,q:"They'd notice if something was off with you (and you with them)."},
 {lvl:3,q:"You know about as much about them as they know about you."},
 {lvl:4,q:"You could show up at their place, or call at 2am, and it'd be welcome."},
 {lvl:4,q:"They've shown up for you in a hard moment."}
];
const ORBIT_VIEWS=[
 ['header','Above the People list','A compact orbit at the top of People, the list underneath. (The design direction’s starting point.)'],
 ['full','As the People screen','A large orbit with names; the list sits below it.'],
 ['toggle','Switch: Orbit or List','People opens as a list with a switch to a large orbit.'],
 ['sheet','On each person’s page','A small orbit on each person’s page showing where they sit.'],
 ['off','Off','Lists only.']
];
const AV_COLORS=['#315E60','#8973A7','#A87836','#5E7A4F','#7A5A4A','#4F6A86','#8B5E73','#6B6F3A'];

function defaultSettings(){return {tiers:JSON.parse(JSON.stringify(DEFAULT_TIERS)),fields:[],timing:Object.assign({},DEFAULT_TIMING),tone:'gentle',orbitView:'header',avatars:'initials',onboarded:false,hints:[],reminders:{inapp:true,calendar:true,push:false},me:null,v:3}}
function normalizeSettings(s){
  const d=defaultSettings(); if(!s||typeof s!=='object')return d;
  const st=Array.isArray(s.tiers)?s.tiers:[];
  const tiers=d.tiers.map(t=>{const sv=Object.assign({},st.find(x=>x&&x.key===t.key)||{});Object.keys(OLD_TEXT).forEach(k=>{if(sv[k]!=null&&OLD_TEXT[k].includes(sv[k]))delete sv[k]});['summary','contact','knowing','asking','effort'].forEach(k=>{if(sv[k]==='')delete sv[k]});return Object.assign({},t,sv)});
  return {
    tiers,
    fields:Array.isArray(s.fields)?s.fields.filter(x=>x&&x.id&&x.name):[],
    timing:Object.assign({},DEFAULT_TIMING,(s.timing&&typeof s.timing==='object')?s.timing:{}),
    tone:['gentle','plain'].includes(s.tone)?s.tone:'gentle',
    orbitView:ORBIT_VIEWS.some(o=>o[0]===s.orbitView)?s.orbitView:'header',
    avatars:['off','initials','photos'].includes(s.avatars)?s.avatars:'initials',
    onboarded:!!s.onboarded,
    hints:Array.isArray(s.hints)?s.hints:[],
    reminders:Object.assign({},d.reminders,s.reminders||{}),
    me:s.me&&typeof s.me==='object'?s.me:null,
    v:3
  };
}

/* ---------- state ---------- */
let S={friends:[],settings:defaultSettings()};
const LS='orbit.v1';
try{const raw=localStorage.getItem(LS);if(raw){const p=JSON.parse(raw);S.friends=Array.isArray(p.friends)?p.friends:[];S.settings=normalizeSettings(p.settings)}}catch(e){}
function cacheLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
let ui={view:'reach',filter:'all',q:'',sheet:null,arm:null,pick:0,peopleMode:'list',lastFocus:null};

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
function isoOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayISO(){return isoOf(new Date())}
function pd(iso){const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)}
function daysSince(iso){return Math.round((pd(todayISO())-pd(iso))/864e5)}
function addDays(iso,n){const d=pd(iso);d.setDate(d.getDate()+n);return isoOf(d)}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtDate(iso){const d=pd(iso);const y=d.getFullYear()!==new Date().getFullYear()?', '+d.getFullYear():'';return MON[d.getMonth()]+' '+d.getDate()+y}
function rel(iso){const n=daysSince(iso);if(n===0)return'today';if(n===1)return'yesterday';if(n<0)return n===-1?'tomorrow':'in '+(-n)+' days';if(n<60)return n+' days ago';if(n<365)return Math.round(n/30)+' months ago';return(n/365).toFixed(1).replace('.0','')+' years ago'}
const clone=o=>JSON.parse(JSON.stringify(o));
const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
function tiers(){return S.settings.tiers}
function tiersTop(){return tiers().slice().reverse()} /* one order everywhere: closest first */
function tierOf(f){return tiers().find(t=>t.key===f.tier)||tiers()[0]}
function tierIdx(f){const i=tiers().findIndex(t=>t.key===f.tier);return i<0?0:i}
function T(k){const v=Number(S.settings.timing[k]);return isNaN(v)?DEFAULT_TIMING[k]:v}
function pT(f,k){const v=f.timing&&f.timing[k];return(v!=null&&v!=='')?Number(v):T(k)}
function cadenceOf(f){return(f.cadence!=null&&f.cadence!=='')?Number(f.cadence):Number(tierOf(f).cadence)||0}
function lastContact(f){let l=null;(f.contacts||[]).forEach(c=>{if(!l||c.date>l.date)l=c});return l}
function lastFrom(f,w){let l=null;(f.contacts||[]).forEach(c=>{if(c.who===w&&(!l||c.date>l.date))l=c});return l}
function dueInfo(f){
  const cad=cadenceOf(f),last=lastContact(f);const since=last?daysSince(last.date):null;
  if(f.dormant||!cad)return{state:'off',cad,last,since};
  if(f.snooze&&f.snooze>todayISO())return{state:'snoozed',cad,last,since,until:f.snooze};
  if(!last)return{state:'never',cad};
  const dueIn=cad-since;
  return{state:dueIn<=0?'overdue':dueIn<=pT(f,'soonDays')?'soon':'ok',cad,last,since,dueIn,ratio:since/cad,dueDate:addDays(last.date,cad)};
}
function balance(f,days){const b={me:0,them:0,mutual:0};(f.contacts||[]).forEach(c=>{if(days&&daysSince(c.date)>days)return;b[c.who]=(b[c.who]||0)+1});b.total=b.me+b.them+b.mutual;return b}
function balanceWords(b,short){
  const n=b.me+b.them;
  if(n<2)return short?'':'Not enough history yet';
  const p=b.me/n;
  if(p>=.7)return short?'You usually start':`You start most: ${b.me} of the last ${n}`;
  if(p<=.3)return short?'They usually start':`They start most: ${b.them} of the last ${n}`;
  return short?'Pretty even':`Pretty even: you ${b.me}, them ${b.them}`;
}
function leans(f){const b=balance(f,T('balanceDays'));const n=b.me+b.them;if(n<3)return'';return b.them/n>=.6?'them':''}
function bdayIn(f){if(!f.birthday)return null;const [,m,d]=f.birthday.split('-').map(Number);if(!m||!d)return null;const t=pd(todayISO());let n=new Date(t.getFullYear(),m-1,d);if(n<t)n=new Date(t.getFullYear()+1,m-1,d);return Math.round((n-t)/864e5)}
function friend(id){return S.friends.find(f=>f.id===id)}
function openFollowups(f){return(f.followups||[]).filter(x=>!x.done)}
function defaultReply(c){return c.who==='me'&&!LIVE.includes(c.mode)?'waiting':''}
function waitingOf(f){return(f.contacts||[]).filter(c=>c.who==='me'&&c.reply==='waiting').sort((a,b)=>b.date.localeCompare(a.date))}
function replyStats(f){
  const out=(f.contacts||[]).filter(c=>c.who==='me'&&c.reply&&(c.reply!=='waiting'||daysSince(c.date)>T('replyDays'))).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
  const ans=out.filter(c=>c.reply==='replied');
  const lags=ans.filter(c=>c.replyDate).map(c=>Math.max(0,Math.round((pd(c.replyDate)-pd(c.date))/864e5)));
  return{n:out.length,ans:ans.length,lag:lags.length?Math.round(lags.reduce((a,x)=>a+x,0)/lags.length):null};
}
function replyWords(f){const r=replyStats(f);if(r.n<2)return'';return `They answered ${r.ans} of your last ${r.n}${r.lag!=null&&r.ans?` · usually ${r.lag===0?'the same day':'within '+r.lag+' day'+(r.lag>1?'s':'')}`:''}`}
function extrasText(c){const x=[];const d=DEPTH.find(v=>v[0]===c.depth);if(d)x.push(d[1]);const fe=FEEL.find(v=>v[0]===c.feel);if(fe)x.push(fe[1]);
  if(c.who==='me'&&c.reply==='waiting')x.push('waiting on a reply');else if(c.reply==='replied')x.push('they replied'+(c.replyDate?(c.replyDate===c.date?' same day':' '+fmtDate(c.replyDate)):''));else if(c.reply==='none')x.push('no reply');
  return x.join(' · ')}
function lastMode(f){const l=lastContact(f);return l&&QUICK_MODES.includes(l.mode)?l.mode:'Text'}
function hashColor(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return AV_COLORS[h%AV_COLORS.length]}
function initials(n){const p=String(n).trim().split(/\s+/).filter(w=>/^[\p{L}\p{N}]/u.test(w));return((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase()}
function avatarHTML(f,lg){
  const m=S.settings.avatars;if(m==='off')return'';
  if(m==='photos'&&f.photo)return `<span class="av${lg?' lg':''}" aria-hidden="true"><img src="${esc(f.photo)}" alt=""></span>`;
  return `<span class="av${lg?' lg':''}" style="background:${f.color||hashColor(f.id+f.name)}" aria-hidden="true">${esc(initials(f.name))}</span>`;
}
const ICON={
 'Text':'<path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
 'Call':'<path d="M6 3h4l2 5-3 2a11 11 0 0 0 5 5l2-3 5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 4 5a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
 'In person':'<circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="16.5" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 20c.6-3.4 2.7-5 5.5-5s4.9 1.6 5.5 5M12.5 15.4c1.1-.3 2.4-.4 4-.4 2.8 0 4.9 1.6 5.5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
 'Video':'<rect x="3" y="6" width="13" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 10l5-3v10l-5-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
 'Social media':'<circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
 'Letter / card':'<rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 6l8.5 7 8.5-7" fill="none" stroke="currentColor" stroke-width="1.8"/>',
 'Other':'<circle cx="6" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="18" cy="12" r="1.6" fill="currentColor"/>'
};
const mIcon=m=>`<svg class="mi" viewBox="0 0 24 24" aria-hidden="true">${ICON[m]||ICON.Other}</svg>`;

/* ---------- tone (user's choice) ---------- */
function say(key,v){
  const g=S.settings.tone!=='plain';
  const L={
   quiet:g?`${v.name} hasn't reached out first in the last ${v.days} days (you did ${v.me} times). At ${v.tier}, it's fair to hope they'll start things sometimes. From their side, this may feel more like ${v.lower} right now, and that's okay to notice.`
          :`Nothing started by ${v.name} in ${v.days} days; you started ${v.me}. A ${v.tier} usually starts things sometimes. This currently looks more like ${v.lower}.`,
   gap:g?`It's been ${v.since} days since you were in touch, a lot longer than a ${v.tier} usually goes. If that's the new normal, a lower tier or Dormant might set kinder expectations.`
        :`${v.since} days since contact, over ${v.mult}× the usual for a ${v.tier}. Consider a lower tier or Dormant.`,
   newf:g?`You've known them less than ${v.days} days. Closeness at this level usually takes a lot of time together, so hold expectations loosely while it builds.`
         :`Known under ${v.days} days. ${v.tier} usually takes much longer; expect less for now.`,
   moved:g?`You moved them up recently with only a few contacts logged. Reflecting on it might help you see whether what's happening matches.`
          :`Moved up ${v.days} days ago with under 5 contacts. Check the placement.`,
   noreply:g?`${v.name} hasn't answered ${v.none} of your last ${v.n} messages. People get busy, and replies aren't everything, but at ${v.tier} it's fair to hope for answers most of the time. It may be worth noticing.`
            :`${v.none} of your last ${v.n} messages to ${v.name} got no reply. A ${v.tier} usually answers most of the time.`,
   check:g?`Your last reflection (${v.date}) pointed to ${v.tier}. It's fine to hope for more; just expect what a ${v.tier} gives for now.`
          :`Last reflection (${v.date}) suggested ${v.tier}. Expect what a ${v.tier} gives.`,
   resLower:g?`You've placed them as ${v.cur}. Hoping it grows is okay. For now, expecting what a ${v.sug} gives is the kinder setting, for both of you.`
             :`Placed as ${v.cur}, but this matches ${v.sug}. Set expectations at ${v.sug}.`,
   resHigher:g?`You've placed them as ${v.cur}, but it sounds like the friendship is further along than that.`:`This matches ${v.sug}, above where you placed them (${v.cur}).`,
   resSame:g?`That matches where you placed them. Your expectations have solid ground.`:`Matches your placement.`,
   unfair:g?`You said what you expected may be more than a ${v.tier} usually gives. That doesn't make the hurt less real; it may mean the expectation needs a conversation, or a different tier.`
           :`Your expectation is above what a ${v.tier} usually gives. Talk about it, or adjust the tier.`
  };

}
function realityNotes(f){
  const out=[];if(f.noChecks)return out;const i=tierIdx(f),t=tierOf(f);
  const qd=pT(f,'quietDays');const b=balance(f,qd);
  if(i>=2&&b.me+b.them>=3&&b.them===0)out.push(say('quiet',{name:f.name,days:qd,me:b.me,tier:t.name,lower:tiers()[Math.max(0,i-1)].name}));
  const d=dueInfo(f);
  if(d.cad&&d.since!=null&&d.since>d.cad*T('gapMult')&&!f.dormant)out.push(say('gap',{since:d.since,tier:t.name,mult:T('gapMult')}));
  const up=(f.tierHistory||[]).filter(m=>tiers().findIndex(x=>x.key===m.to)>tiers().findIndex(x=>x.key===m.from));
  const first=(f.contacts||[]).reduce((a,c)=>!a||c.date<a?c.date:a,f.created||null);
  if(i>=3&&first&&daysSince(first)<T('newDays'))out.push(say('newf',{days:T('newDays'),tier:t.name}));
  else if(i>=3&&up.length&&daysSince(up[up.length-1].date)<T('moveDays')&&(f.contacts||[]).length<5)out.push(say('moved',{days:daysSince(up[up.length-1].date)}));
  {const r=replyStats(f);const none=r.n-r.ans;if(i>=2&&r.n>=3&&none>=3&&none/r.n>=.5)out.push(say('noreply',{name:f.name,none,n:r.n,tier:t.name}))}
  if(f.lastCheck&&f.lastCheck.suggested!=null&&f.lastCheck.suggested<i)out.push(say('check',{date:fmtDate(f.lastCheck.date),tier:tiers()[f.lastCheck.suggested].name}));

}

/* ---------- sync (claude.ai account storage; falls back to this device) ---------- */
const IN_CLAUDE=!!(window.claude&&window.claude.use);
const Sync={col:null,q:{},first:true,state:'local',readonly:false};
function setSync(s){
  Sync.state=s;const el=$('#sync');el.className='sync '+s;
  el.querySelector('span').textContent={cloud:'Synced',local:'This device',loading:'Loading…',slow:'Can’t reach sync yet',error:'Sync error',readonly:'Read-only'}[s]||s;
  if(ui.view==='more')render();
}
async function initSync(){
  try{
    if(!IN_CLAUDE){setSync('local');return}
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user){setSync('local');return}
    const uid=await user.id();if(!uid){setSync('local');return}
    Sync.col=db.collection('data/users/'+uid);setSync('loading');
    const timer=setTimeout(()=>{if(Sync.state==='loading')setSync('slow')},10000);
    Sync.col.onSnapshot(snap=>{if(!snap.metadata.fromCache)clearTimeout(timer);applySnap(snap)},()=>{clearTimeout(timer);setSync('error')});
  }catch(e){setSync('local')}
}
function applySnap(snap){
  if(snap.empty&&snap.metadata.fromCache&&Sync.first)return;
  if(Sync.first&&!snap.metadata.fromCache){
    Sync.first=false;
    if(snap.empty){S.friends.forEach(f=>writeDoc('f_'+f.id,f));writeDoc('settings',S.settings);setSync('cloud');return}
  }
  const fr=[];let st=null;
  snap.docs.forEach(d=>{const v=d.data();if(!v)return;if(d.id==='settings')st=v;else if(d.id.indexOf('f_')===0)fr.push(clone(v))});
  S.friends=fr;if(st)S.settings=normalizeSettings(clone(st));
  cacheLocal();if(Sync.state!=='readonly')setSync('cloud');softRender();
}
function writeDoc(id,data){
  if(!Sync.col||Sync.readonly)return;
  const body=data===null?null:clone(data);const prev=Sync.q[id]||Promise.resolve();
  Sync.q[id]=prev.then(()=>body===null?Sync.col.doc(id).delete():Sync.col.doc(id).set(body)).catch(e=>{
    const c=e&&e.code;
    if(c==='invalid_argument'){Sync.readonly=true;setSync('readonly');toast('Couldn’t save to your account; changes stay on this device.')}
    else if(c==='quota_exceeded')toast('Storage is full. Delete some old contacts, photos or people.');
    else if(c==='unavailable')setTimeout(()=>writeDoc(id,data),800+Math.random()*1200);
  });
}
function saveFriend(f){const i=S.friends.findIndex(x=>x.id===f.id);if(i<0)S.friends.push(f);else S.friends[i]=f;cacheLocal();writeDoc('f_'+f.id,f)}
function removeFriend(id){S.friends=S.friends.filter(f=>f.id!==id);cacheLocal();writeDoc('f_'+id,null)}
function saveSettings(){cacheLocal();writeDoc('settings',S.settings)}

/* ---------- files: calendar + backup ---------- */
async function download(name,text,type){
  if(IN_CLAUDE){
    if(!/\.json$/.test(name)){toast('Calendar files can’t be saved from the claude.ai version of Orbit yet.');return false}
    try{const dl=await window.claude.use('downloads');if(!dl){toast('Saving files isn’t available here. Use Copy backup instead.');return false}
      await dl.save({filename:name,data:text});return true}
    catch(e){if(!(e&&e.code==='declined'))toast('Couldn’t save the file. Use Copy backup instead.');return false}
  }
  try{const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true}
  catch(e){toast('This page can’t save files here. Use Copy backup instead.');return false}
}
function dueDateOf(f){const d=dueInfo(f);if(d.state==='off')return null;if(d.state==='snoozed')return d.until;if(d.state==='never'||d.dueIn<=0)return todayISO();return d.dueDate}
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function icsFor(list){
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';const ev=[];
  list.forEach(f=>{
    const due=dueDateOf(f);
    if(due){const end=addDays(due,1);const asks=openFollowups(f).map(x=>'Ask about: '+x.text).join('\n');
      ev.push(['BEGIN:VEVENT','UID:orbit-'+f.id+'-'+due+'@orbit','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+due.replace(/-/g,''),'DTEND;VALUE=DATE:'+end.replace(/-/g,''),
        'SUMMARY:'+icsEsc('Reach out to '+f.name),'DESCRIPTION:'+icsEsc(tierOf(f).name+' · '+lastLine(f)+(asks?'\n'+asks:'')),'TRANSP:TRANSPARENT',
        'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Reach out to '+f.name),'TRIGGER:PT9H','END:VALARM','END:VEVENT'].join('\r\n'))}
    const bn=bdayIn(f);
    if(bn!=null){const s=addDays(todayISO(),bn);const lead=pT(f,'bdayDays');
      ev.push(['BEGIN:VEVENT','UID:orbit-bday-'+f.id+'@orbit','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+s.replace(/-/g,''),'DTEND;VALUE=DATE:'+addDays(s,1).replace(/-/g,''),'RRULE:FREQ=YEARLY',
        'SUMMARY:'+icsEsc(f.name+'’s birthday'),'TRANSP:TRANSPARENT',
        ...(lead>0?['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(f.name+'’s birthday is coming up'),'TRIGGER:-P'+lead+'D','END:VALARM']:[]),
        'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(f.name+'’s birthday is today'),'TRIGGER:PT9H','END:VALARM','END:VEVENT'].join('\r\n'))}
  });
  if(!ev.length){toast('Nothing to add: no reminders or birthdays set.');return}
  const txt=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Orbit//EN','CALSCALE:GREGORIAN',...ev,'END:VCALENDAR'].join('\r\n');
  download(list.length===1?'orbit-'+list[0].name.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.ics':'orbit-reminders.ics',txt,'text/calendar').then(ok=>ok&&toast(`Calendar file made (${ev.length} event${ev.length>1?'s':''}). Open it to add to your calendar.`));
}
function shrinkPhoto(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=128,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');const m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);res(c.toDataURL('image/jpeg',.8))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

/* ---------- orbit drawing ---------- */
function orbitSVG(list,size,opts={}){
  const ts=tiers(),n=ts.length,c=size/2,R=size/2-(opts.labels?26:14);
  const rOf=i=>R*(0.26+0.74*(n-1-i)/(n-1)); /* closest tier innermost */
  let rings='',dots='';
  ts.forEach((t,i)=>{const r=rOf(i);rings+=`<circle class="ring" cx="${c}" cy="${c}" r="${r}"/>`;
    if(opts.ringLabels)rings+=`<text class="rl" x="${c}" y="${c-r-4}" text-anchor="middle">${esc(t.name)}</text>`});
  const big=size>=300;
  ts.forEach((t,i)=>{
    const people=list.filter(f=>f.tier===t.key).sort((a,b)=>a.name.localeCompare(b.name));if(!people.length)return;
    const r=rOf(i);let dr=big?11:7;const circ=2*Math.PI*r;
    let cap=Math.max(1,Math.floor(circ/(dr*2+3)));
    if(people.length>cap){dr=Math.max(big?6:4,Math.floor(circ/people.length/2-1.5));cap=Math.max(1,Math.floor(circ/(dr*2+2)))}
    const tracks=Math.ceil(people.length/cap);const per=Math.ceil(people.length/tracks);
    const off=(i*0.73)%(2*Math.PI);
    people.forEach((f,k)=>{
      const tr=Math.floor(k/per),kk=k%per;const rr=r+(tracks>1?(tr-(tracks-1)/2)*(dr*2+2):0);
      const gap=opts.ringLabels?0.42:0;const a=-Math.PI/2+gap+((off+kk*(2*Math.PI-2*gap)/per)%(2*Math.PI-2*gap||2*Math.PI));const x=c+rr*Math.cos(a),y=c+rr*Math.sin(a);
      const d=dueInfo(f);const due=d.state==='overdue'||d.state==='never';
      const cls=['od',f.dormant?'dorm':'',leans(f)==='them'?'them':''].join(' ');
      const lab=`${f.name}, ${t.name}${due?', due':''}${f.dormant?', dormant':''}`;
      const showIni=dr>=10&&S.settings.avatars!=='off';
      const showName=opts.labels&&list.length<=18;
      dots+=`<g class="${cls}" role="button" tabindex="0" data-act="open" data-id="${f.id}" aria-label="${esc(lab)}"><title>${esc(lab)}</title>
        ${due?`<circle class="halo" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${dr+3}"/>`:''}
        <circle class="d" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${dr}"/>
        ${showIni&&!f.dormant?`<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="middle">${esc(initials(f.name))}</text>`:''}
        ${showName?`<text class="nm" x="${x.toFixed(1)}" y="${(y+dr+12).toFixed(1)}" text-anchor="middle">${esc(f.name.split(' ')[0])}</text>`:''}
        ${opts.hl===f.id?`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${dr+6}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`:''}</g>`;
    });
  });
  const counts=tiersTop().map(t=>{const k=list.filter(f=>f.tier===t.key).length;return k?`${k} ${t.name}${k>1?'s':''}`:''}).filter(Boolean).join(', ');
  return `<svg class="orbit" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="group" aria-label="Your orbit: ${esc(counts||'no one yet')}. Inner rings are closer friendships.">${rings}
    <circle class="you" cx="${c}" cy="${c}" r="${big?15:11}"/><text class="youl" x="${c}" y="${c+3.5}" text-anchor="middle">You</text>${dots}</svg>`;
}
function orbitLegend(){return `<div class="olegend" aria-hidden="true"><span><i style="background:var(--teal)"></i>closer rings = closer, not more important</span><span><i style="border:2px solid var(--amber)"></i>due</span><span><i style="background:var(--other)"></i>they usually start</span><span><i style="border:1.5px dashed var(--stone)"></i>dormant</span></div>`}
function miniOrbit(f){
  const size=92,ts=tiers(),n=ts.length,c=size/2,R=size/2-6;const rOf=i=>R*(0.26+0.74*(n-1-i)/(n-1));
  let s=ts.map((t,i)=>`<circle class="ring" cx="${c}" cy="${c}" r="${rOf(i)}"${t.key===f.tier?' style="stroke:var(--teal);stroke-width:1.5"':''}/>`).join('');
  const r=rOf(tierIdx(f));const a=-Math.PI/4;
  (f.tierHistory||[]).slice(-3).forEach((m,j)=>{const fi=ts.findIndex(x=>x.key===m.from);if(fi<0)return;const rr=rOf(fi);const aa=a-(0.5+j*.35);s+=`<circle cx="${(c+rr*Math.cos(aa)).toFixed(1)}" cy="${(c+rr*Math.sin(aa)).toFixed(1)}" r="3" fill="none" stroke="var(--stone)" stroke-dasharray="2 1.5"/>`});
  s+=`<circle class="you" cx="${c}" cy="${c}" r="7"/><circle cx="${(c+r*Math.cos(a)).toFixed(1)}" cy="${(c+r*Math.sin(a)).toFixed(1)}" r="6" fill="var(--teal)"/>`;
  return `<svg class="orbit" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(f.name)} sits on the ${esc(tierOf(f).name)} ring${(f.tierHistory||[]).length?'; faint dots show where they were before':''}.">${s}</svg>`;
}

function openSheet(s){
  if(!ui.sheet)ui.lastFocus=document.activeElement;
  ui.sheet=s;ui.arm=null;document.getElementById('app').classList.add('open');renderSheet();

}
function closeSheet(){
  ui.sheet=null;document.getElementById('app').classList.remove('open');

  if(lf&&document.body.contains(lf))lf.focus();
}
function sheetHead(title,back){
  return `<div class="grab"></div><div class="in"><div class="hd">${back?`<button class="back" data-act="${back.act}" data-id="${back.id||''}">‹ ${esc(back.label)}</button>`:`<span></span>`}<button class="x" data-act="close" aria-label="Close">✕</button></div>${title?`<h3 id="sheetTitle" tabindex="-1">${title}</h3>`:''}`;
}
function renderSheet(){
  const s=ui.sheet;if(!s)return;const el=$('#sheet');
  if(s.type==='add')return sheetAdd(el);
  if(s.type==='intro')return sheetIntro(el);
  if(s.type==='me')return sheetMe(el);
  const f=friend(s.id);if(!f){closeSheet();return}
  if(s.type==='edit')return sheetEdit(el,f);
  if(s.type==='reflect')return sheetReflect(el,f);
  if(s.type==='checkin')return sheetCheckin(el,f);
  if(s.type==='repair')return sheetRepair(el,f);

}

const STYLES={
 steady:{name:'Steady',you:'You’re mostly comfortable with closeness and with time apart. You can usually say what’s wrong and trust things will be okay.',
   signs:'Replies at a steady pace, brings things up directly, doesn’t panic or disappear.'},
 reassure:{name:'Seeks reassurance',you:'Closeness matters a lot to you, and quiet stretches can feel bigger than they are. Reassurance helps you settle.',
   signs:'Checks in often, reads into slow replies, feels better once they hear things are okay.'},
 space:{name:'Needs space',you:'You value independence and can pull back when things get close or tense. You may keep feelings to yourself.',
   signs:'Pulls back when things get intense, keeps feelings private, is very independent.'},
 pushpull:{name:'Push-pull',you:'You want closeness and can also back away from it. It can swing depending on stress and the person.',
   signs:'Comes close and then backs off; can swing between needing you and needing space.'}
};
const ME_QUIZ=[
 {d:'anx',q:'I worry people will lose interest in me.'},
 {d:'avo',q:'I’d rather not depend on other people.'},
 {d:'anx',q:'When someone takes a while to reply, I wonder if something’s wrong.'},
 {d:'avo',q:'I get uneasy when someone wants to be very close.'},
 {d:'anx',q:'I need to hear that people care before I can relax.'},
 {d:'avo',q:'It’s hard for me to open up about what I’m feeling.'},
 {d:'anx',q:'I often feel more invested than the other person.'},
 {d:'avo',q:'When things get intense, my first move is to take space.'}

const AGREE=[[1,'Not me'],[2,'A little'],[3,'Sometimes'],[4,'Mostly'],[5,'Very me']];
function styleFrom(anx,avo){const hi=x=>x>=3.25;return hi(anx)&&hi(avo)?'pushpull':hi(anx)?'reassure':hi(avo)?'space':'steady'}
function myStyle(){return (S.settings.me&&S.settings.me.style)||''}

function pairing(you,them){
  if(!them)return null;
  const P={
   'reassure|space':{n:'This can turn into a chase: the more one of you reaches, the more the other pulls back. Their space usually isn’t about how much they care.',h:['Give space with a time attached: “Can we talk tomorrow?”','Send one message, then wait.','Ask what helps them feel close without pressure.']},
   'space|reassure':{n:'They may feel uneasy when you go quiet, even when nothing is wrong on your side.',h:['A short “busy, but thinking of you” goes a long way.','Say when you need time instead of just disappearing.','Small, regular check-ins calm things more than big ones.']},
   'reassure|reassure':{n:'Lots of warmth, and you may both read a lot into silence. It’s easy to spiral together.',h:['Agree on a rough rhythm for checking in.','Assume good intent before reading into a slow reply.','Say the reassuring thing out loud; you both need it.']},
   'space|space':{n:'Comfortable and low-pressure, but things can drift or go unsaid for a long time.',h:['Put a recurring plan on the calendar.','Name small things before they grow.','Reach out first sometimes, even if it feels unnecessary.']}
  };
  if(them==='steady')return{n:'A steady friend tends to make things easier: they’re likely to say what’s wrong and come back after a conflict.',h:['Say what you need plainly; they can usually take it.','Let their steadiness be a model when you feel wobbly.']};
  if(them==='pushpull'||you==='pushpull')return{n:'Closeness may come in waves. Predictability and patience help more than chasing the swings.',h:['Be consistent and follow through on what you say.','Don’t chase the pull-backs; check in calmly instead.','Talk about the pattern when things are good, not mid-swing.']};
  if(you==='steady')return{reassure:{n:'They may need more reassurance than you do. Your steadiness can help them settle.',h:['Reply when you can, even briefly.','Say the caring thing out loud; don’t assume they know.']},space:{n:'They may need more room than you do. Space is usually how they recharge, not a verdict on the friendship.',h:['Don’t take quiet stretches personally.','Give a heads-up before bigger conversations.']}}[them]||null;
  return P[you+'|'+them]||null;
}

function strengthSignals(f){
  const s=[],w=[];
  const b=balance(f,365),n=b.me+b.them;
  if(n>=4){const p=b.me/n;if(p>.3&&p<.7)s.push('Both of you start things.');else w.push(p>=.7?'You start most of the contact.':'They start most of the contact.')}
  const r=replyStats(f);if(r.n>=3){if(r.ans/r.n>=.7)s.push('They usually answer when you reach out.');else if(r.ans/r.n<=.4)w.push('Many of your messages go unanswered.')}
  const cad=cadenceOf(f);if(cad&&!f.dormant){const c90=(f.contacts||[]).filter(c=>daysSince(c.date)<=90).length;const want=Math.max(1,Math.floor(90/cad*.6));
    if(c90>=want)s.push('You stay in regular touch.');else if((f.contacts||[]).length>=3)w.push('Contact has been patchy lately.')}
  const fe=(f.contacts||[]).filter(c=>c.feel).slice(-10);if(fe.length>=3){const g=fe.filter(c=>c.feel==='good').length,hd=fe.filter(c=>c.feel==='hard').length;if(g/fe.length>=.6)s.push('Most of your time together feels good.');if(hd/fe.length>=.4)w.push('Several check-ins felt off.')}
  const dp=(f.contacts||[]).filter(c=>c.depth).slice(-10);if(dp.length>=3&&dp.filter(c=>c.depth!=='quick').length/dp.length>=.5)s.push('Your conversations go past the surface.');
  const first=(f.contacts||[]).reduce((a,c)=>!a||c.date<a?c.date:a,f.created||null);if(first&&daysSince(first)>=365)s.push('Long history: since '+fmtDate(first)+'.');
  if(f.tempered)s.push('Tested by hard seasons and still here.');
  const pl=f.plans||[];if(pl.some(p=>p.status==='resolved'&&p.outcome==='repaired'))s.push('You’ve worked through something hard together.');
  if(pl.some(p=>p.status==='open'))w.push('Something is still being worked through.');
  const pr=pairing(myStyle(),f.style);if(pr&&(myStyle()==='reassure'&&f.style==='space'||myStyle()==='space'&&f.style==='reassure'||f.style==='pushpull'||myStyle()==='pushpull'))w.push('Your ways of connecting can pull against each other (see below).');
  else if(f.style==='steady')s.push('They connect in a steady way.');
  let label;
  if(s.length+w.length<2)label='Not enough history to tell yet';
  else if(s.length>=3&&w.length<=1)label='Looks sturdy';

/* ---------- Work through something ---------- */
const R_TYPES=[['hurt','They hurt me'],['me','I hurt them'],['misread','Misunderstanding'],['expect','Unmet expectation'],['drift','Drifting apart'],['unsure','Not sure']];
const R_WANTS=[['understand','To understand them'],['understood','To be understood'],['apology','An apology'],['apologize','To apologize'],['change','A change going forward'],['clear','To clear the air'],['letgo','To let it go']];
const PATHS={
 letgo:{n:'Let it go, on purpose',d:'Small, one-time, or more than this tier usually gives. Decide to release it, and adjust what you expect.'},
 clarify:{n:'Ask a question',d:'Check your read before reacting. Good for mixed signals and misunderstandings.'},
 talk:{n:'Talk it through',d:'Name what happened and how it landed, then really listen to their side.'},
 apologize:{n:'Apologize and repair',d:'Own your part without excuses, and ask what would help.'},

 expect:{n:'Reset the expectation',d:'Tell them what matters to you, or move them to a tier that fits what’s really there.'},

function recPath(p){

function openerFor(path,f,p){

   apologize:`I’ve been thinking about ${w}. I’m sorry. That wasn’t fair to you. Is there anything that would help?`,
   boundary:`I care about our friendship, so I want to be honest about something that keeps happening: ${w}. It’s hard for me. Going forward, I need ___.`,
   expect:`I realized something matters to me more than I’ve said: ___. Is that something that works for you?`,

const ASKS=['How did that land for you?','Is there something going on for you that I missed?','What would help next time?'];

function sheetRepair(el,f){

    b=`<p class="lede">What happened?</p><label class="sr" for="rpWhat">What happened</label><textarea id="rpWhat" placeholder="Just the facts, in a sentence or two. e.g. they cancelled our plans last minute again">${esc(p.what||'')}</textarea>
    <label class="f">What kind of thing is it?</label><div class="chips wrap" role="group" aria-label="Kind">${R_TYPES.map(([v,l])=>`<button class="chip ${p.type===v?'on':''}" data-act="rp" data-k="type" data-v="${v}" aria-pressed="${p.type===v}">${l}</button>`).join('')}</div>`+nav(p.type);
  }else if(s.step===1){
    b=`<p class="lede">How big is it, and how are you?</p>${seg('size',[['small','Small'],['medium','On my mind'],['big','It really hurt']],'How big is it?')}
    ${seg('mood',[['calm','Calm'],['stirred','Still stirred up'],['flooded','Flooded']],'How are you right now?')}
    ${p.mood==='flooded'?`<div class="reality"><p>Give yourself some time first. Hard talks go better when you’re not flooded. A walk, sleep, or a day can change how this looks. You can save this plan and come back to it.</p></div>`:''}`+nav(p.size&&p.mood);
  }else if(s.step===2){
    b=p.type==='me'?`<p class="lede">Your part</p><p>When you’re the one who hurt someone, the expectation check doesn’t really apply. Name what you did, as plainly as you can.</p><label class="sr" for="rpMine">What I did</label><textarea id="rpMine" placeholder="e.g. I forgot their birthday and didn’t say anything">${esc(p.mine||'')}</textarea>`+nav(true)
    :`<p class="lede">Check the expectation</p><p class="muted">${esc(f.name)} is a ${esc(t.name)}. ${esc(t.summary||'')}</p>
    <div class="exp"><h4>Fair to expect</h4><ul>${lines(t.expect).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h4>Not fair to expect yet</h4><ul>${lines(t.notyet).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    ${seg('fair',[['y','Yes'],['u','Not sure'],['n','No']],'Was what you wanted on the fair list?')}
    ${seg('told',[['y','Yes'],['n','No']],'Have you told them this matters to you?')}`+nav(p.fair&&p.told);
  }else if(s.step===3){
    b=`<p class="lede">What do you want from this?</p><p class="muted">Pick any that fit. Knowing this keeps the conversation pointed somewhere.</p>
    <div class="chips wrap" role="group" aria-label="What you want">${R_WANTS.map(([v,l])=>`<button class="chip ${p.wants.includes(v)?'on':''}" data-act="rpWant" data-v="${v}" aria-pressed="${p.wants.includes(v)}">${l}</button>`).join('')}</div>`+nav(p.wants.length);
  }else if(s.step===4){
    b=`<p class="lede">Their side</p><p class="muted">What might be going on for ${esc(f.name)}? You don’t have to agree with it; just imagine it.</p>
    <ul class="plain"><li>A busy or hard season</li><li>They didn’t know it mattered to you</li><li>They connect differently${f.style?' ('+esc(STYLES[f.style].name.toLowerCase())+')':''}</li><li>They’re hurt about something too</li></ul>
    <label class="sr" for="rpTheirs">Their side</label><textarea id="rpTheirs" placeholder="My best guess at their side">${esc(p.theirs||'')}</textarea>
    ${seg('pattern',[['once','First time'],['again','Happened before'],['often','Keeps happening']],'Is this a pattern?')}`+nav(p.pattern);
  }else if(s.step===5){
    const rec=recPath(p);if(!p.path)p.path=rec;
    b=`<p class="lede">Choose a path</p><p class="muted">Based on your answers, <b>${esc(PATHS[rec].n.toLowerCase())}</b> looks like a good fit. Any path is okay to choose.</p>
    <div class="tierpick" role="radiogroup" aria-label="Path">${Object.entries(PATHS).map(([k,v])=>`<label><input type="radio" name="rpPath" value="${k}" ${p.path===k?'checked':''}><div><b>${esc(v.n)}${k===rec?' · suggested':''}</b><span>${esc(v.d)}</span></div></label>`).join('')}</div>`+nav(p.path);
  }else{
    if(!p.opener||p.openerFor!==p.path){p.opener=openerFor(p.path,f,p);p.openerFor=p.path}
    if(p.how==null)p.how=howFor(p.path,p);
    const tip=themTip(f);
    b=`<p class="lede">Your gameplan: ${esc(PATHS[p.path].n.toLowerCase())}</p>
    ${p.path!=='letgo'?`<label class="f">How</label><div class="chips wrap" role="group" aria-label="How">${['In person','Call','Video','Text'].map(m=>`<button class="chip ${p.how===m?'on':''}" data-act="rp" data-k="how" data-v="${m}" aria-pressed="${p.how===m}">${mIcon(m)} ${m}</button>`).join('')}</div>
    <label class="f" for="rpWhen">When</label><input type="date" id="rpWhen" min="${todayISO()}" value="${esc(p.when||'')}">`:''}
    <label class="f" for="rpOpen">${p.path==='letgo'?'A note to yourself':'How you might start'}</label><textarea id="rpOpen">${esc(p.opener)}</textarea>
    ${['talk','boundary','expect','apologize'].includes(p.path)?`<label class="f">What to say, in your words</label>
      <div class="fill"><span>When</span><input type="text" id="rpW" value="${esc(p.sW!=null?p.sW:(p.what||''))}" aria-label="When ..."></div>
      <div class="fill"><span>I felt</span><input type="text" id="rpF" value="${esc(p.sF||'')}" placeholder="hurt, left out, confused…" aria-label="I felt ..."></div>
      <div class="fill"><span>${p.path==='apologize'?'I’ll':'I’d like'}</span><input type="text" id="rpL" value="${esc(p.sL||'')}" placeholder="${p.path==='apologize'?'do differently…':'what would help…'}" aria-label="I'd like ..."></div>`:''}
    ${p.path!=='letgo'&&p.path!=='time'?`<p class="kicker" style="margin-top:var(--s4)">Questions to ask</p><ul class="plain">${ASKS.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    ${tip?`<div class="pair"><p><b>With ${esc(f.name)}:</b> ${esc(tip)}</p></div>`:''}
    <p class="kicker" style="margin-top:var(--s4)">Try to avoid</p><ul class="plain watch">${avoidFor(f,p.path).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <p class="kicker" style="margin-top:var(--s4)">Afterwards</p><ul class="plain"><li>Log the conversation as a check-in, with how it felt.</li><li>Come back here and mark how it went.</li>${p.fair==='n'&&p.type!=='me'?`<li>If what you wanted is more than a ${esc(t.name)} gives, consider Reflect on this friendship.</li>`:''}</ul>
    <div class="acts" style="margin-top:var(--s4)"><button class="btn quiet" data-act="rpBack">Back</button><button class="btn primary" data-act="rpSave" data-id="${f.id}">Save my gameplan</button></div>`;
  }
  el.innerHTML=sheetHead('Work through something',{act:'open',id:f.id,label:f.name})+bar+b+`</div>`;
  const bind=(id,k)=>{const x=el.querySelector(id);if(x)x.oninput=()=>{p[k]=x.value}};
  bind('#rpWhat','what');bind('#rpMine','mine');bind('#rpTheirs','theirs');bind('#rpOpen','opener');bind('#rpW','sW');bind('#rpF','sF');bind('#rpL','sL');
  const wd=el.querySelector('#rpWhen');if(wd)wd.onchange=()=>{p.when=wd.value};
  el.querySelectorAll('input[name=rpPath]').forEach(r=>r.onchange=()=>{p.path=r.value;renderSheet()});
}
function plansHTML(f){
  const pl=(f.plans||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));if(!pl.length)return'';
  const open=pl.filter(p=>p.status!=='resolved'),done=pl.filter(p=>p.status==='resolved');
  const card=p=>`<li class="r"><div class="main"><b>${esc(PATHS[p.path]?PATHS[p.path].n:'Plan')}</b><div class="meta">${esc(p.what||'')}${p.when&&p.status!=='resolved'?' · '+(p.when<=todayISO()?'today or past':'on '+fmtDate(p.when)):''}${p.status==='resolved'?' · '+esc({repaired:'Repaired',better:'Better',unresolved:'Not resolved',released:'Let it go'}[p.outcome]||'Done')+' '+fmtDate(p.resolvedDate||p.date):''}</div>
    <div class="acts"><button class="btn" data-act="viewPlan" data-id="${f.id}" data-p="${p.id}">View</button>${p.status!=='resolved'?`<button class="btn quiet" data-act="resolvePlan" data-id="${f.id}" data-p="${p.id}">How did it go?</button>`:''}</div></div></li>`;
  return `<div class="ps"><h4>Working through</h4><ul class="rows">${open.map(card).join('')}</ul>${done.length?`<details class="fold"><summary>Past (${done.length})</summary><ul class="rows">${done.map(card).join('')}</ul></details>`:''}</div>`;
}
function sheetPlan(el,f){
  const p=(f.plans||[]).find(x=>x.id===ui.sheet.pid);if(!p){ui.sheet={type:'person',id:f.id};return renderSheet()}
  const resolving=ui.sheet.resolve;
  el.innerHTML=sheetHead(esc(PATHS[p.path].n),{act:'open',id:f.id,label:f.name})+`
  <dl class="facts"><dt>What happened</dt><dd>${esc(p.what||'—')}</dd>${p.how?`<dt>How</dt><dd>${esc(p.how)}</dd>`:''}${p.when?`<dt>When</dt><dd>${fmtDate(p.when)}</dd>`:''}<dt>Made</dt><dd>${fmtDate(p.date)}</dd></dl>
  <div class="reality"><p>${esc(p.opener||'')}</p></div>
  ${p.sW||p.sF||p.sL?`<p>When ${esc(p.sW||'…')}, I felt ${esc(p.sF||'…')}. ${p.path==='apologize'?'I’ll':'I’d like'} ${esc(p.sL||'…')}.</p>`:''}
  ${p.theirs?`<p class="note">Their side, my guess: ${esc(p.theirs)}</p>`:''}

  ${p.status!=='resolved'?`<label class="f">How did it go?</label><div class="seg" role="group" aria-label="Outcome">${[['repaired','Repaired'],['better','Better'],['unresolved','Not resolved'],['released','Let it go']].map(([v,l])=>`<button data-act="planOutcome" data-id="${f.id}" data-p="${p.id}" data-v="${v}">${l}</button>`).join('')}</div>`
  :`<p class="note">Marked ${esc({repaired:'repaired',better:'better',unresolved:'not resolved',released:'let go'}[p.outcome]||'done')} on ${fmtDate(p.resolvedDate||p.date)}.</p><div class="acts"><button class="btn quiet" data-act="planReopen" data-id="${f.id}" data-p="${p.id}">Reopen</button></div>`}
  <div class="acts" style="margin-top:var(--s5)"><button class="btn danger" data-act="planDelete" data-id="${f.id}" data-p="${p.id}">${ui.arm==='plan'+p.id?'Tap again to delete':'Delete plan'}</button></div></div>`;
}
function flowchartSVG(){
  const W=350,bx=6,bw=196,rx=236,rw=110,bh=46,gap=22;
  const Q=[['What happened?',null],['Are you calm enough?','No → Give it time'],['Did you hurt them?','Yes → Apologize'],['Fair for their tier?','No → Reset the expectation or let it go'],['Could it be a misread?','Yes → Ask a question'],['Does it keep happening?','Yes → Set a boundary']];
  let y=8,s='';
  Q.forEach(([q,side],i)=>{
    s+=`<rect x="${bx}" y="${y}" width="${bw}" height="${bh}" rx="10" class="fc-q"/><text x="${bx+bw/2}" y="${y+bh/2+5}" text-anchor="middle" class="fc-t">${esc(q)}</text>`;
    if(side){const [yn,out]=side.split(' → ');s+=`<path d="M${bx+bw} ${y+bh/2} H${rx}" class="fc-l"/><text x="${bx+bw+6}" y="${y+bh/2-6}" class="fc-yn">${yn}</text>
      <rect x="${rx}" y="${y+2}" width="${rw}" height="${bh-4}" rx="10" class="fc-o"/>${wrapT(out,rx+rw/2,y+bh/2,12)}`}
    const ny=y+bh+gap;
    if(i<Q.length-1){s+=`<path d="M${bx+bw/2} ${y+bh} V${ny}" class="fc-l"/>${side?`<text x="${bx+bw/2+8}" y="${y+bh+15}" class="fc-yn">${side.startsWith('No')?'Yes':'No'}</text>`:''}`}
    y=ny;
  });
  s+=`<path d="M${bx+bw/2} ${y-gap} V${y}" class="fc-l"/><text x="${bx+bw/2+8}" y="${y-gap+15}" class="fc-yn">No</text><rect x="${bx}" y="${y}" width="${bw}" height="${bh}" rx="10" class="fc-o"/><text x="${bx+bw/2}" y="${y+bh/2+5}" text-anchor="middle" class="fc-t">Talk it through</text>`;
  const H=y+bh+8;
  return `<svg class="flow" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Flowchart: What happened? If you're not calm, give it time. If you hurt them, apologize. If it wasn't fair for their tier, reset the expectation or let it go. If it could be a misread, ask a question. If it keeps happening, set a boundary. Otherwise, talk it through.">
  <defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--stone)"/></marker></defs>${s}</svg>`;
}
function wrapT(t,x,yc,max){const w=t.split(' ');const L=[];let c='';w.forEach(x2=>{if((c+' '+x2).trim().length>max){L.push(c.trim());c=x2}else c+=' '+x2});if(c.trim())L.push(c.trim());
  const y0=yc-(L.length-1)*7+4;return L.map((l,i)=>`<text x="${x}" y="${y0+i*14}" text-anchor="middle" class="fc-o-t">${esc(l)}</text>`).join('')}

function sheetIntro(el){

  const P=[
   {h:'Welcome to your orbit',b:`<p>Orbit is a quiet place to keep track of the people in your life: how close you are, who reached out last, and what’s fair to expect.</p>${guideOrbit()}<p class="muted" style="margin-top:var(--s3)">Five rings, from Acquaintance on the outside to Homie closest to you. Closer means closer, not more important.</p>`},
   {h:'The ladder',b:`<ul class="rows">${tiersTop().map(t=>`<li class="r"><div class="main"><b>${esc(t.name)}</b> <span class="muted">${esc(t.summary||'')}</span><div class="meta">Test: ${esc(t.test)}</div></div></li>`).join('')}</ul><p class="muted" style="margin-top:var(--s3)">Place people by what’s happening now, not what you hope. You can move anyone, any time.</p>`},
   {h:'Two buttons, one habit',b:`<div class="logbtns" aria-hidden="true"><span class="btn primary">I reached out</span><span class="btn them">They did</span></div><p style="margin-top:var(--s4)">After any text, call or hangout, tap one. That’s the whole habit.</p><p>Who starts matters. It’s how Orbit notices when one person is carrying a friendship, and it’s what the gentle reminders are built on.</p>`},
   {h:'Expectations, kindly',b:`<p>Every tier says what’s fair to expect and what isn’t yet. When someone lets you down, <b>Reflect on this friendship</b> helps you check the expectation against what’s really happening.</p>${toneBlock(1)}<p class="note">You can change this any time in More.</p>`}
  ];
  const p=P[s.step];
  el.innerHTML=sheetHead('')+`<div class="steps" aria-hidden="true">${P.map((_,i)=>`<i class="${i<=s.step?'on':''}"></i>`).join('')}</div><div class="intro"><h3 id="sheetTitle" tabindex="-1">${p.h}</h3>${p.b}</div>
  <div class="acts" style="margin-top:var(--s5)">${s.step>0?`<button class="btn quiet" data-act="iBack">Back</button>`:`<button class="btn quiet" data-act="iDone">Skip</button>`}<button class="btn primary" data-act="${s.step<P.length-1?'iNext':'iDone'}" style="flex:1">${s.step<P.length-1?'Next':(S.friends.length?'Done':'Add your first person')}</button></div></div>`;
}

function render(){
  const v={reach:vReach,people:vPeople,log:vLog,guide:vGuide,more:vMore}[ui.view]||vReach;
  $('#view').innerHTML=v();renderTabs();
  const q=$('#q');if(q)q.oninput=()=>{ui.q=q.value;const pos=q.selectionStart;render();const n=$('#q');n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}};
  const ov=$('#ov');if(ov)ov.onchange=()=>{S.settings.orbitView=ov.value;saveSettings();render();toast('Orbit view: '+esc((ORBIT_VIEWS.find(o=>o[0]===ov.value)||[])[1]||''))};
  document.querySelectorAll('[data-timing]').forEach(x=>x.onchange=()=>{S.settings.timing[x.dataset.timing]=Math.max(0,parseInt(x.value,10)||0);saveSettings();toast('Saved')});
  const rf=$('#restoreFile');if(rf)rf.onchange=()=>{const fl=rf.files[0];if(!fl)return;fl.text().then(t=>{$('#restore').value=t;toast('Backup loaded. Tap Merge in or Replace everything.')})};
  document.querySelectorAll('[data-tier]').forEach(x=>x.onchange=()=>{const t=tiers().find(t=>t.key===x.dataset.tier);if(!t)return;const fld=x.dataset.field;t[fld]=fld==='cadence'?Math.max(0,parseInt(x.value,10)||0):x.value;saveSettings();toast('Saved')});
}
function softRender(){
  const a=document.activeElement;
  const inSheet=a&&$('#sheet').contains(a)&&a.matches('input,textarea,select');
  const inView=a&&$('#view').contains(a)&&a.matches('textarea,input:not([type=search]),select');
  if(!inView)render();else renderTabs();
  if(ui.sheet&&!inSheet)renderSheet();
}
