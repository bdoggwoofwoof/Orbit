function realityNotes(f){
  const out=[];if(f.noChecks)return out;const i=tierIdx(f),t=tierOf(f);

  if(i>=2&&b.me+b.them>=3&&b.them===0)out.push(say('quiet',{name:f.name,days:qd,me:b.me,tier:t.name,lower:tiers()[Math.max(0,i-1)].name}));
  const d=dueInfo(f);
  if(d.cad&&d.since!=null&&d.since>d.cad*T('gapMult')&&!f.dormant)out.push(say('gap',{since:d.since,tier:t.name,mult:T('gapMult')}));
  const up=(f.tierHistory||[]).filter(m=>tiers().findIndex(x=>x.key===m.to)>tiers().findIndex(x=>x.key===m.from));
  const first=(f.contacts||[]).reduce((a,c)=>!a||c.date<a?c.date:a,f.created||null);
  if(i>=3&&first&&daysSince(first)<T('newDays'))out.push(say('newf',{days:T('newDays'),tier:t.name}));
  else if(i>=3&&up.length&&daysSince(up[up.length-1].date)<T('moveDays')&&(f.contacts||[]).length<5)out.push(say('moved',{days:daysSince(up[up.length-1].date)}));
  {const r=replyStats(f);const none=r.n-r.ans;if(i>=2&&r.n>=3&&none>=3&&none/r.n>=.5)out.push(say('noreply',{name:f.name,none,n:r.n,tier:t.name}))}
  if(f.lastCheck&&f.lastCheck.suggested!=null&&f.lastCheck.suggested<i)out.push(say('check',{date:fmtDate(f.lastCheck.date),tier:tiers()[f.lastCheck.suggested].name}));
  return out;
}

/* ---------- sync (claude.ai account storage; falls back to this device) ---------- */
const IN_CLAUDE=!!(window.claude&&window.claude.use);
const Sync={col:null,q:{},first:true,state:'local',readonly:false};
function setSync(s){
  Sync.state=s;const el=$('#sync');el.className='sync '+s;
  el.querySelector('span').textContent={cloud:'Synced',local:'This device',loading:'Loading…',slow:'Can’t reach sync yet',error:'Sync error',readonly:'Read-only'}[s]||s;
  if(ui.view==='more')render();
}
async function initSync(){
  try{
    if(!IN_CLAUDE){setSync('local');return}
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user){setSync('local');return}
    const uid=await user.id();if(!uid){setSync('local');return}
    Sync.col=db.collection('data/users/'+uid);setSync('loading');
    const timer=setTimeout(()=>{if(Sync.state==='loading')setSync('slow')},10000);
    Sync.col.onSnapshot(snap=>{if(!snap.metadata.fromCache)clearTimeout(timer);applySnap(snap)},()=>{clearTimeout(timer);setSync('error')});
  }catch(e){setSync('local')}
}
function applySnap(snap){
  if(snap.empty&&snap.metadata.fromCache&&Sync.first)return;
  if(Sync.first&&!snap.metadata.fromCache){
    Sync.first=false;
    if(snap.empty){S.friends.forEach(f=>writeDoc('f_'+f.id,f));writeDoc('settings',S.settings);setSync('cloud');return}
  }
  const fr=[];let st=null;
  snap.docs.forEach(d=>{const v=d.data();if(!v)return;if(d.id==='settings')st=v;else if(d.id.indexOf('f_')===0)fr.push(clone(v))});
  S.friends=fr.map(normalizeFriend);if(st)S.settings=normalizeSettings(clone(st));migrateFields();
  cacheLocal();if(Sync.state!=='readonly')setSync('cloud');softRender();
}
function writeDoc(id,data){if(window.TOUR_DEMO)return;
  if(!Sync.col||Sync.readonly)return;
  const body=data===null?null:clone(data);const prev=Sync.q[id]||Promise.resolve();
  Sync.q[id]=prev.then(()=>body===null?Sync.col.doc(id).delete():Sync.col.doc(id).set(body)).catch(e=>{
    const c=e&&e.code;
    if(c==='invalid_argument'){Sync.readonly=true;setSync('readonly');toast('Couldn’t save to your account; changes stay on this device.')}
    else if(c==='quota_exceeded')toast('Storage is full. Delete some old contacts, photos or people.');
    else if(c==='unavailable')setTimeout(()=>writeDoc(id,data),800+Math.random()*1200);
  });
}
function saveFriend(f){if(!window.TOUR_DEMO)f.updated=Date.now();const i=S.friends.findIndex(x=>x.id===f.id);if(i<0)S.friends.push(f);else S.friends[i]=f;cacheLocal();writeDoc('f_'+f.id,f)}
function removeFriend(id){S.friends=S.friends.filter(f=>f.id!==id);cacheLocal();writeDoc('f_'+id,null)}
function saveSettings(){cacheLocal();writeDoc('settings',S.settings)}

/* ---------- files: calendar + backup ---------- */
async function download(name,text,type){
  if(IN_CLAUDE){
    if(!/\.json$/.test(name)){toast('Calendar files can’t be saved from the claude.ai version of Orbit yet.');return false}
    try{const dl=await window.claude.use('downloads');if(!dl){toast('Saving files isn’t available here. Use Copy backup instead.');return false}
      await dl.save({filename:name,data:text});return true}
    catch(e){if(!(e&&e.code==='declined'))toast('Couldn’t save the file. Use Copy backup instead.');return false}
  }
  try{const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true}
  catch(e){toast('This page can’t save files here. Use Copy backup instead.');return false}
}
function dueDateOf(f){const d=dueInfo(f);if(d.state==='off')return null;if(d.state==='snoozed')return d.until;if(d.state==='never'||d.dueIn<=0)return todayISO();return d.dueDate}
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function icsFor(list){
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';const ev=[];
  list.forEach(f=>{
    const due=dueDateOf(f);
    if(due){const end=addDays(due,1);const asks=openFollowups(f).map(x=>'Ask about: '+x.text).join('\n');
      ev.push(['BEGIN:VEVENT','UID:orbit-'+f.id+'-'+due+'@orbit','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+due.replace(/-/g,''),'DTEND;VALUE=DATE:'+end.replace(/-/g,''),
        'SUMMARY:'+icsEsc('Reach out to '+f.name),'DESCRIPTION:'+icsEsc(tierOf(f).name+' · '+lastLine(f)+(asks?'\n'+asks:'')),'TRANSP:TRANSPARENT',
        'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Reach out to '+f.name),'TRIGGER:PT9H','END:VALARM','END:VEVENT'].join('\r\n'))}
    const bn=bdayIn(f);
    if(bn!=null){const s=addDays(todayISO(),bn);const lead=pT(f,'bdayDays');
      ev.push(['BEGIN:VEVENT','UID:orbit-bday-'+f.id+'@orbit','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+s.replace(/-/g,''),'DTEND;VALUE=DATE:'+addDays(s,1).replace(/-/g,''),'RRULE:FREQ=YEARLY',
        'SUMMARY:'+icsEsc(f.name+'’s birthday'),'TRANSP:TRANSPARENT',
        ...(lead>0?['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(f.name+'’s birthday is coming up'),'TRIGGER:-P'+lead+'D','END:VALARM']:[]),
        'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(f.name+'’s birthday is today'),'TRIGGER:PT9H','END:VALARM','END:VEVENT'].join('\r\n'))}
  });
  if(!ev.length){toast('Nothing to add: no reminders or birthdays set.');return}
  const txt=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Orbit//EN','CALSCALE:GREGORIAN',...ev,'END:VCALENDAR'].join('\r\n');
  download(list.length===1?'orbit-'+list[0].name.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.ics':'orbit-reminders.ics',txt,'text/calendar').then(ok=>ok&&toast(`Calendar file made (${ev.length} event${ev.length>1?'s':''}). Open it to add to your calendar.`));
}
function shrinkPhoto(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=128,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');const m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);res(c.toDataURL('image/jpeg',.8))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

function orbitSVG(list,size,opts={}){

    return `<svg class="orbit" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(counts)}">${rings}<circle class="you" cx="${c}" cy="${c}" r="11"/><text class="youl" x="${c}" y="${c+3.5}" text-anchor="middle">You</text>${b}</svg>`;
  }
  ts.forEach((t,i)=>{

    const r=rOf(i);let dr=big?11:7;const circ=2*Math.PI*r;

    if(people.length>cap){dr=Math.max(big?6:4,Math.floor(circ/people.length/2-1.5));cap=Math.max(1,Math.floor(circ/(dr*2+2)))}
    const tracks=Math.ceil(people.length/cap);const per=Math.ceil(people.length/tracks);
    const off=(i*0.73)%(2*Math.PI);
    people.forEach((f,k)=>{
      const tr=Math.floor(k/per),kk=k%per;const rr=r+(tracks>1?(tr-(tracks-1)/2)*(dr*2+2):0);
      const gap=opts.ringLabels?0.42:0;const a=-Math.PI/2+gap+((off+kk*(2*Math.PI-2*gap)/per)%(2*Math.PI-2*gap||2*Math.PI));const x=c+rr*Math.cos(a),y=c+rr*Math.sin(a);
      const d=dueInfo(f);const due=d.state==='overdue';
      const cls=['od',f.dormant?'dorm':''].join(' ');
      const gl=groupsOf(f).map(g=>g.name).join(', ');const lab=`${f.name}, ${t.name}${gl?', '+gl:''}${due?', due':''}${f.dormant?', dormant':''}`;
      const showIni=dr>=10;
      const showName=false;if(opts.names)pts.push({f,x,y,dr});

        <circle class="hit" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${Math.max(13,dr+3)}" fill="transparent"/>
        ${due?`<circle class="halo" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${dr+3}"/>`:''}
        <circle class="d" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${dr}" style="fill:${f.dormant?'transparent':colorOf(f)}${f.dormant?';stroke:'+colorOf(f):''}"/>
        ${showIni&&!f.dormant?`<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="middle">${esc(initials(f.name))}</text>`:''}
        ${showName?`<text class="nm${crowd?' sm':''}" x="${x.toFixed(1)}" y="${(up?y-dr-4:y+dr+(crowd?10:12)).toFixed(1)}" text-anchor="middle">${esc(f.name.split(' ')[0])}</text>`:''}
        ${opts.hl===f.id?`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${dr+6}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`:''}</g>`;

      const cand=[[p.x,p.y+p.dr+hh,'middle'],[p.x,p.y-p.dr-3,'middle'],[p.x+p.dr+3,p.y+fs/2-1,'start'],[p.x-p.dr-3,p.y+fs/2-1,'end']];

    <circle class="you" cx="${c}" cy="${c}" r="${big?15:11}"/><text class="youl" x="${c}" y="${c+3.5}" text-anchor="middle">You</text>${dots}</svg>`;
}

function vGuide(){
  let h=`<p class="lede">A ladder for how close a friendship is, plus a few tags that describe it in other ways. It’s a map, not a ranking of anyone’s worth, and people move both directions over time.</p>
  <nav class="toc" aria-label="On this page">${[['g-why','Why a ladder'],['g-ladder','The ladder'],['g-arabic','The Arabic ladder'],['g-best','Best friend'],['g-tags','Tags'],['g-kinds','Three kinds of friendship'],['g-close','How closeness grows'],['g-connect','How people connect'],['g-wrong','When something goes wrong'],['g-expect','Setting expectations'],['g-remember','Good to remember']].map(([id,l])=>`<button class="linkbtn" data-act="jump" data-t="${id}">${l}</button>`).join('')}</nav>
  <div class="orbitbox">${guideOrbit()}</div>
  <section class="sec" id="g-why"><h2>Why a ladder</h2><div class="prose" style="margin-top:var(--s3)">
   <p>This ladder started with Newt, who made Orbit. He grew up in a small mountain town with eight people in his graduating class, and knew everything about all of them. In college he burned out trying to know everyone that well and give every person the same priority, stranger or best friend.</p>
   <p>The ladder is how he sorted it out: different relationships, different levels, and time spent to match. You don’t need to add everyone to Orbit. Start with the people you want to keep up with.</p>
   <p>It describes how things are. It doesn’t prescribe how they should be. Use the words that fit your life.</p></div></section>
  <section class="sec" id="g-ladder"><h2>The ladder</h2><p class="sub">Every tier is described the same four ways: <b>Contact</b> (why and how you see each other), <b>Knowing</b> (how well you know each other), <b>Asking</b> (what you could fairly ask of them) and <b>Effort</b> (who starts things). Each step up adds one thing: chosen, then planned, then go-to, then your person in a group. The <b>big-news test</b> under each tier asks: if something big happened to you, good or bad, what would happen with this person?</p>`;
  tiersTop().forEach(t=>{
    const n=S.friends.filter(f=>f.tier===t.key).length;
    h+=`<div class="rung" data-k="${t.key}"><h3>${esc(t.name)}${t.ar&&!isAr()?` <span class="arw" lang="ar">${t.ar.v}</span>`:''} <small>${n?n+' '+(n===1?'person':'people')+' · ':''}${t.cadence?'reminder every '+t.cadence+' days':'no reminder'}</small></h3>${tierDef(t)}${t.test?`<div class="test"><b>Big-news test:</b> ${esc(t.test)}</div>`:''}${t.ex?`<p class="small muted" style="margin-top:var(--s2)">Examples: ${esc(t.ex)}</p>`:''}
    <details class="fold"><summary>What to expect</summary><div class="exp"><h4>Fair to expect</h4><ul>${lines(t.expect).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h4>Not fair to expect yet</h4><ul>${notyetHTML(t)}</ul></div></details></div>`;
  });
  h+=`<div class="rung"><h3>Stranger</h3><p style="margin-top:6px">Someone you haven’t met. Not tracked here, but any stranger could end up anywhere on this ladder.</p></div></section>
  <section class="sec" id="g-arabic"><h2>${isAr()?'سُلَّم الأصدقاء بالعربية':'The Arabic ladder'}</h2>${arabicLadderHTML()}</section>
  <section class="sec" id="g-best"><h2>Best friend</h2><div class="prose" style="margin-top:var(--s3)"><p>The top spot, taken literally: your <b>best</b> friend. Usually a Homie and often a Platonic soulmate. Everything a best friend should be, with grace, because everyone is human.</p>
  <ul><li><b>Overarching:</b> your best friend across your whole life right now. Only one at a time, and it can change.</li><li><b>Of a season:</b> the best friend of a setting or stretch of life (college, a job, a city). You can have one per context.</li></ul></div></section>
  <section class="sec" id="g-tags"><h2>Tags</h2><p class="sub">Tags sit on top of the ladder rather than on it, because they describe something other than closeness.</p>`;
  MARKERS.forEach(m=>{h+=`<div class="rung"><h3>${esc(m.name)}</h3><p style="margin-top:6px">${esc(m.desc)}</p></div>`});
  h+=`</section><section class="sec" id="g-kinds"><h2>Three kinds of friendship</h2><div class="prose" style="margin-top:var(--s3)">
   <p>Aristotle (<i>Nicomachean Ethics</i>, Book VIII) noticed that we love friends for different reasons:</p>
   <ul><li><b>Utility:</b> what they do for you, or you for them, like a coworker who covers your shift.</li><li><b>Pleasure:</b> enjoying each other, like the friend you always laugh with.</li><li><b>Virtue:</b> who they actually are, and who you become around them.</li></ul>
   <p>None is wrong, and any tier can be any mix. Closer friendships often include all three. More time together doesn’t automatically make a better friendship; the reason you’re friends matters too.</p><p>If it helps, you can mark the kind on someone’s page under Understand this friendship. It’s optional.</p></div></section>
  <section class="sec" id="g-close"><h2>How closeness grows</h2><div class="prose" style="margin-top:var(--s3)">
   <p>Psychologists Harry Reis and Phillip Shaver found that closeness isn’t built by sharing alone. It’s sharing plus a response: you open up, and the other person shows up for it in a way that leaves you feeling understood, validated and cared for.</p>
   <ul><li>Friends may not share much that’s vulnerable yet. The ones who do are more likely to move up.</li><li>Good friends share and respond well, both ways.</li><li>With Homies, you can trust them with very vulnerable things, and they handle it well.</li></ul>
   <p>When you log a contact, you can note if someone opened up and whether the other showed up for it. Over time that shows up in Strength &amp; fit.</p></div></section>
  <section class="sec" id="g-connect"><h2>How people connect</h2><div class="prose" style="margin-top:var(--s3)">
   <p>Attachment research suggests people tend to lean toward a few patterns in close relationships. Orbit uses plain names for them. They’re rough tendencies, not types or diagnoses, and the same person can look different with different people or under stress.</p>
   <ul>${Object.values(STYLES).map(v=>`<li><b>${v.name}:</b> ${v.signs}</li>`).join('')}</ul>
   <p>Knowing your own pattern and guessing theirs can explain a lot: why a slow reply stings, why someone goes quiet after a hard talk, or why a friendship feels effortless. Take the check in More → How you connect, and pick a pattern on anyone’s page.</p></div></section>
  <section class="sec" id="g-wrong"><h2>When something goes wrong</h2><p class="sub">A rough map. On anyone’s page, <b>Work through something</b> walks you through it step by step and saves a gameplan.</p>
   <div class="flowbox">${flowchartSVG()}</div></section>`;
  h+=`<section class="sec" id="g-expect"><h2>Setting expectations</h2><div class="prose" style="margin-top:var(--s3)">
   <p>A lot of hurt in friendship comes from expecting a <b>Good friend’s</b> effort from someone who’s really a <b>Friend</b> (or less) from their side. The tier is where your expectations should live.</p>
   <ul><li><b>Place people by what’s happening, not what you hope.</b> Who starts things, how often you see each other, and whether they know you as well as you know them.</li>
   <li><b>When you feel let down, check the tier first.</b> Was what you expected on the “fair to expect” list for where they really are?</li>
   <li><b>Hope up, expect level.</b> It’s fine to want someone to become a Good friend. Expect a Friend’s effort until they show more.</li>
   <li><b>Say it out loud.</b> If something matters (“I’d love it if you came to my birthday”), ask. People can’t meet expectations they don’t know about.</li>
   <li>Use <b>Reflect on this friendship</b> on anyone’s page when you’re unsure, after a disappointment, or right after you move someone up.</li></ul>
   <p>On anyone’s page, each expectation you write down gets three checks. A healthy expectation is all three:</p>
   <ul><li><b>Reasonable:</b> it fits where they are on the ladder.</li><li><b>Clearly said:</b> you’ve told them, in words, not hints.</li><li><b>Agreed on:</b> they said yes to it. Not just “they didn’t argue.”</li></ul>
   <h3 style="font:600 var(--t-md) var(--sans);margin-top:var(--s4)">Not fair to expect from anyone</h3>
   <p>Some things aren’t fair to ask of any friend, however close:</p><ul>${NEVER.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></section>
  <section class="sec" id="g-remember"><h2>Good to remember</h2><div class="prose" style="margin-top:var(--s3)"><ul>
   <li>Place people where you’d both agree. If it only feels close from one side, the lower tier is the honest one.</li>
   <li>Closeness takes time together. Research by Jeffrey Hall (2018) estimated roughly 50 hours to go from acquaintance to casual friend, about 90 to friend, and over 200 to a close friend.</li>
   <li>Everyone has limited room up top. Most people only have a handful of people at the closest level, so it’s normal for the upper tiers to be small.</li>
   <li>Moving someone down isn’t a verdict on them. Seasons change, and Dormant exists for that.</li></ul></div></section>`;
  return h;
}

const STYLES={

 reassure:{name:'Seeks reassurance',you:'Closeness matters a lot to you, and quiet stretches can feel bigger than they are. Reassurance helps you settle.',
   signs:'Checks in often, reads into slow replies, feels better once they hear things are okay.'},
 space:{name:'Needs space',you:'You value independence and can pull back when things get close or tense. You may keep feelings to yourself.',
   signs:'Pulls back when things get intense, keeps feelings private, is very independent.'},

   signs:'Comes close and then backs off; can swing between needing you and needing space.'}

 {d:'avo',q:'I get uneasy when someone wants to be very close.'},

function pairing(you,them){
  if(!them)return null;
  const P={
   'reassure|space':{n:'This can turn into a chase: the more one of you reaches, the more the other pulls back. Their space usually isn’t about how much they care.',h:['Give space with a time attached: “Can we talk tomorrow?”','Send one message, then wait.','Ask what helps them feel close without pressure.']},
   'space|reassure':{n:'They may feel uneasy when you go quiet, even when nothing is wrong on your side.',h:['A short “busy, but thinking of you” goes a long way.','Say when you need time instead of just disappearing.','Small, regular check-ins calm things more than big ones.']},
   'reassure|reassure':{n:'Lots of warmth, and you may both read a lot into silence. It’s easy to spiral together.',h:['Agree on a rough rhythm for checking in.','Assume good intent before reading into a slow reply.','Say the reassuring thing out loud; you both need it.']},
   'space|space':{n:'Comfortable and low-pressure, but things can drift or go unsaid for a long time.',h:['Put a recurring plan on the calendar.','Name small things before they grow.','Reach out first sometimes, even if it feels unnecessary.']}
  };

function strengthSignals(f){
  const s=[],w=[];
  const b=balance(f,365),n=b.me+b.them;
  if(n>=4){const p=b.me/n;if(p>.3&&p<.7)s.push('Both of you start things.');else w.push(p>=.7?'You start most of the contact.':'They start most of the contact.')}
  const r=replyStats(f);if(r.n>=3){if(r.ans/r.n>=.7)s.push('They usually answer when you reach out.');else if(r.ans/r.n<=.4)w.push('Many of your messages go unanswered.')}
  const cad=cadenceOf(f);if(cad&&!f.dormant){const c90=(f.contacts||[]).filter(c=>daysSince(c.date)<=90).length;const want=Math.max(1,Math.floor(90/cad*.6));
    if(c90>=want)s.push('You stay in regular touch.');else if((f.contacts||[]).length>=3)w.push('Contact has been patchy lately.')}
  const fe=(f.contacts||[]).filter(c=>c.feel).slice(-10);if(fe.length>=3){const g=fe.filter(c=>c.feel==='good').length,hd=fe.filter(c=>c.feel==='hard').length;if(g/fe.length>=.6)s.push('Most of your time together feels good.');if(hd/fe.length>=.4)w.push('Several check-ins felt off.')}
  const dp=(f.contacts||[]).filter(c=>c.depth).slice(-10);if(dp.length>=3&&dp.filter(c=>c.depth!=='quick').length/dp.length>=.5)s.push('Your conversations go past the surface.');
  const first=(f.contacts||[]).reduce((a,c)=>!a||c.date<a?c.date:a,f.created||null);if(first&&daysSince(first)>=365)s.push('Long history: since '+fmtDate(first)+'.');
  const op=(f.contacts||[]).filter(c=>c.opened).slice(-12);
  if(op.length>=2){const meOpen=op.filter(c=>c.opened!=='them'),met=meOpen.filter(c=>c.resp==='yes').length,miss=meOpen.filter(c=>c.resp==='no').length;
    if(op.some(c=>c.opened!=='me')&&op.some(c=>c.opened!=='them'))s.push('You both open up to each other.');
    else if(meOpen.length>=3&&!op.some(c=>c.opened!=='me'))w.push('You open up more than they do.');
    if(met>=2&&met>miss)s.push('They show up when you open up.');else if(miss>=2)w.push('When you open up, it often isn’t met.')}
  if(f.tempered)s.push('Tested by hard seasons and still here.');
  const pl=f.plans||[];if(pl.some(p=>p.status==='resolved'&&p.outcome==='repaired'))s.push('You’ve worked through something hard together.');
  if(pl.some(p=>p.status==='open'))w.push('Something is still being worked through.');
  const pr=pairing(myStyle(),f.style);if(pr&&(myStyle()==='reassure'&&f.style==='space'||myStyle()==='space'&&f.style==='reassure'||f.style==='pushpull'||myStyle()==='pushpull'))w.push('Your ways of connecting can pull against each other (see below).');

  if(s.length+w.length<2)label='Not enough history to tell yet';
  else if(s.length>=3&&w.length<=1)label='Looks sturdy';

  return{s,w,label};
}

const R_TYPES=[['hurt','They hurt me'],['me','I hurt them'],['misread','Misunderstanding'],['expect','Unmet expectation'],['drift','Drifting apart'],['unsure','Not sure']];

const PATHS={
 letgo:{n:'Let it go, on purpose',d:'Small, one-time, or more than this tier usually gives. Decide to release it, and adjust what you expect.'},

 talk:{n:'Talk it through',d:'Name what happened and how it landed, then really listen to their side.'},
 apologize:{n:'Apologize and repair',d:'Own your part without excuses, and ask what would help.'},

function recPath(p){
  if(p.type==='me')return'apologize';

}
function openerFor(path,f,p){

   talk:`مرحبًا، هناك أمر يشغل بالي، وأفضّل أن نتحدث عنه بدل أن أتركه. هل لديك وقت ${p.when?'يوم '+fmtDate(p.when):'قريبًا'}؟`,

   expect:`أدركتُ أن أمرًا يهمني أكثر مما قلت: ___. هل يناسبك ذلك؟`,

   letgo:`(ملاحظة لنفسي) أختار أن أترك هذا لأن ___. إن عاد، سأختار طريقًا آخر.`}[path]}
  const w=(p.what||'').trim()||'what happened';

function howFor(path,p){if(path==='letgo')return'';if(path==='time')return'Text';return p.size==='big'||path==='boundary'||path==='apologize'?'In person':path==='clarify'?'Call':'In person'}

function flowchartSVG(){
  const W=350,bx=6,bw=196,rx=236,rw=110,bh=46,gap=22;
  const Q=[['What happened?',null],['Are you calm enough?','No → Give it time'],['Did you hurt them?','Yes → Apologize'],['Fair for their tier?','No → Reset the expectation or let it go'],['Could it be a misread?','Yes → Ask a question'],['Does it keep happening?','Yes → Set a boundary']];
  let y=8,s='';
  Q.forEach(([q,side],i)=>{
    s+=`<rect x="${bx}" y="${y}" width="${bw}" height="${bh}" rx="10" class="fc-q"/><text x="${bx+bw/2}" y="${y+bh/2+5}" text-anchor="middle" class="fc-t">${esc(q)}</text>`;
    if(side){const [yn,out]=side.split(' → ');s+=`<path d="M${bx+bw} ${y+bh/2} H${rx}" class="fc-l"/><text x="${bx+bw+6}" y="${y+bh/2-6}" class="fc-yn">${yn}</text>
      <rect x="${rx}" y="${y+2}" width="${rw}" height="${bh-4}" rx="10" class="fc-o"/>${wrapT(out,rx+rw/2,y+bh/2,12)}`}
    const ny=y+bh+gap;
    if(i<Q.length-1){s+=`<path d="M${bx+bw/2} ${y+bh} V${ny}" class="fc-l"/>${side?`<text x="${bx+bw/2+8}" y="${y+bh+15}" class="fc-yn">${side.startsWith('No')?'Yes':'No'}</text>`:''}`}
    y=ny;
  });
  s+=`<path d="M${bx+bw/2} ${y-gap} V${y}" class="fc-l"/><text x="${bx+bw/2+8}" y="${y-gap+15}" class="fc-yn">No</text><rect x="${bx}" y="${y}" width="${bw}" height="${bh}" rx="10" class="fc-o"/><text x="${bx+bw/2}" y="${y+bh/2+5}" text-anchor="middle" class="fc-t">Talk it through</text>`;
  const H=y+bh+8;
  return `<svg class="flow" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Flowchart: What happened? If you're not calm, give it time. If you hurt them, apologize. If it wasn't fair for their tier, reset the expectation or let it go. If it could be a misread, ask a question. If it keeps happening, set a boundary. Otherwise, talk it through.">
  <defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--stone)"/></marker></defs>${s}</svg>`;
}
function wrapT(t,x,yc,max){const w=t.split(' ');const L=[];let c='';w.forEach(x2=>{if((c+' '+x2).trim().length>max){L.push(c.trim());c=x2}else c+=' '+x2});if(c.trim())L.push(c.trim());
  const y0=yc-(L.length-1)*7+4;return L.map((l,i)=>`<text x="${x}" y="${y0+i*14}" text-anchor="middle" class="fc-o-t">${esc(l)}</text>`).join('')}
